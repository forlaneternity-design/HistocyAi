#!/usr/bin/env python3
"""build_cytovision.py - one file that forms the Cytovision app and its CI workflow.

Usage (repo root, next to the source HTML):
    python build_cytovision.py [--src Cytovision_Intelligence_ProMax_v5_0.html]

It writes:
    dist/                 hardened, modular, offline-capable app (deploy this folder)
    tests/app.test.mjs    unit + hardening tests (node --test)
    tests/smoke.mjs       headless-browser test: tabs, errors, real image analysis
    .github/workflows/ci.yml   build -> test -> deploy to GitHub Pages
Stdlib only. Re-running is idempotent. Research use only: no clinical validation.
"""
import argparse, glob, hashlib, pathlib, re, sys

CSP = ("default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; worker-src blob: 'self'; "
       "style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; "
       "connect-src 'self' https: http://localhost:* http://127.0.0.1:*; "
       "object-src 'none'; base-uri 'none'; form-action 'none'")

UID = ("const uid=()=>{const b=new Uint8Array(6);crypto.getRandomValues(b);"
       "return Array.from(b,x=>x.toString(36).padStart(2,'0')).join('').slice(0,8)+Date.now().toString(36).slice(-4)};")

NO_DIRECT = ("(()=>{throw new Error('Copilot needs a server gateway (/api/copilot). "
             "Browser-direct API keys are disabled.')})();")

WORKFLOW = """name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python build_cytovision.py
      - run: node --check dist/app.js && node --check dist/app2.js
      - run: node --test tests/app.test.mjs
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-test
    runs-on: ubuntu-latest
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: '${{ steps.d.outputs.page_url }}'}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
"""

TESTS = r"""import {test} from 'node:test';
import assert from 'node:assert/strict';
import fs from 'node:fs';
const js = fs.readFileSync('dist/app.js', 'utf8') + fs.readFileSync('dist/app2.js', 'utf8');
const html = fs.readFileSync('dist/index.html', 'utf8');
function grab(start, end) {
  const i = js.indexOf(start); assert.ok(i >= 0, 'missing ' + start);
  const j = js.indexOf(end, i); assert.ok(j > i, 'unterminated ' + start);
  return js.slice(i, j + end.length);
}
const Stats = new Function(grab('const Stats=(()=>{', '\n})();') + ';return Stats')();
const sha256 = new Function(grab('function sha256(str){', '\n}\n') + ';return sha256')();
const near = (a, b, e = 0.01) => assert.ok(Math.abs(a - b) < e, `${a} !~ ${b}`);

test('sha256 known answers', () => {
  assert.equal(sha256('abc'), 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad');
  assert.equal(sha256(''), 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855');
});
test('cohen kappa', () => near(Stats.kappa({labels: ['a', 'b'], m: [[20, 5], [10, 15]], n: 50}), 0.4, 1e-9));
test('dice and iou', () => {
  near(Stats.dice([1, 1, 0, 0], [1, 0, 1, 0]), 0.5, 1e-9);
  near(Stats.iou([1, 1, 0, 0], [1, 0, 1, 0]), 1 / 3, 1e-9);
});
test('wilson interval 8/10', () => {
  const [lo, hi] = Stats.wilson(8, 10); near(lo, 0.490); near(hi, 0.943);
});
test('hardening present', () => {
  assert.match(html, /Content-Security-Policy/);
  assert.ok(!/<script>/.test(html), 'inline script left in index.html');
  assert.ok(!js.includes('dangerous-direct-browser-access'), 'direct browser key path remains');
  assert.ok(!/\beval\(/.test(js), 'eval remains');
  assert.ok(!js.includes('const uid=()=>Math.random'), 'weak uid remains');
});
test('assets exist', () => {
  for (const f of ['app.css', 'app.js', 'app2.js', 'sw.js', 'manifest.webmanifest']) assert.ok(fs.existsSync('dist/' + f), f);
});
"""


SMOKE = r"""import http from 'node:http';
import fs from 'node:fs';
import path from 'node:path';
import {chromium} from 'playwright';
const root = path.resolve('dist');
const types = {'.html': 'text/html', '.js': 'text/javascript', '.css': 'text/css', '.svg': 'image/svg+xml', '.webmanifest': 'application/manifest+json'};
const srv = http.createServer((q, r) => {
  const u = decodeURIComponent(q.url.split('?')[0]); const f = path.join(root, u === '/' ? 'index.html' : u);
  if (!f.startsWith(root) || !fs.existsSync(f)) { r.writeHead(404); return r.end(); }
  r.writeHead(200, {'content-type': types[path.extname(f)] || 'application/octet-stream'}); fs.createReadStream(f).pipe(r);
}).listen(0);
await new Promise(r => srv.on('listening', r));
const b = await chromium.launch(); const pg = await b.newPage({viewport: {width: 420, height: 860}}); const errs = [];
pg.on('pageerror', e => errs.push('JS: ' + e.message));
pg.on('console', m => { if (m.type() === 'error') errs.push('console: ' + m.text()); });
await pg.goto(`http://localhost:${srv.address().port}/index.html`); await pg.waitForTimeout(1500);
const n = await pg.locator('#tabs button').count(); if (n < 9) errs.push('expected 9 tabs, got ' + n);
for (let i = 0; i < n; i++) { await pg.locator('#tabs button').nth(i).click(); await pg.waitForTimeout(300); }
await pg.evaluate(() => { ACT.loadDemo(); }); await pg.waitForTimeout(600);
await pg.evaluate(async () => {
  S.activeId = S.cases[0].id; go('bench'); await new Promise(r => setTimeout(r, 800));
  const c = active(); c.analysis = null; c.ai = null; c.annotations = [];
  const cv = document.createElement('canvas'); cv.width = 640; cv.height = 480; const g = cv.getContext('2d');
  g.fillStyle = '#ecc8d6'; g.fillRect(0, 0, 640, 480); g.fillStyle = '#462878';
  for (let i = 0; i < 40; i++) { g.beginPath(); g.arc(40 + (i % 8) * 75, 50 + Math.floor(i / 8) * 80, 12, 0, 7); g.fill(); }
  const bl = await new Promise(r => cv.toBlob(r, 'image/png'));
  await ingestImage(c, new File([bl], 's.png', {type: 'image/png'}));
});
await pg.waitForFunction(() => active() && active().analysis, null, {timeout: 20000}).catch(() => errs.push('analysis never completed'));
const cnt = await pg.evaluate(() => { const a = active().analysis; return a && a.summary ? a.summary.count : 0; });
if (cnt < 30) errs.push('nuclei count too low: ' + cnt);
await b.close(); srv.close();
if (errs.length) { console.error(errs.join('\n')); process.exit(1); }
console.log('smoke ok: ' + n + ' tabs, ' + cnt + ' nuclei measured');
"""


def find_src(arg):
    if arg:
        return pathlib.Path(arg)
    c = [p for p in glob.glob('Cytovision*.html') + glob.glob('*.html') if 'dist' not in p]
    if not c:
        sys.exit('No source HTML found. Pass --src <file>.')
    return pathlib.Path(c[0])


def patch(s, old, new, name):
    if old not in s:
        print('WARN patch not applied:', name)
        return s
    return s.replace(old, new, 1)


def main():
    ap = argparse.ArgumentParser()
    ap.add_argument('--src')
    ap.add_argument('--out', default='dist')
    a = ap.parse_args()
    src = find_src(a.src)
    s = src.read_text(encoding='utf-8')

    # ---- security / correctness patches (applied to the source text) ----
    s = re.sub(r"const uid=\(\)=>Math\.random\(\)[^\n]*\n", UID + "\n", s, count=1)
    s = patch(s, "'https://api.anthropic.com/v1/messages'", "''", 'drop direct Anthropic default endpoint')
    s = re.sub(r":\{'content-type':'application/json','x-api-key':cfg\.key[^}]*\};", ":" + NO_DIRECT, s, count=1)
    s = re.sub(r"window\[k\]\|\|eval\(k\)", "window[k]", s)
    s = re.sub(r"\bconst (evalSet)=", r"let \1=", s)  # v5 layer reassigns it; const threw at startup

    # ---- split inline CSS/JS so a strict CSP (no unsafe-inline scripts) can apply ----
    css = re.search(r"<style>(.*?)</style>", s, re.S)
    scripts = re.findall(r"<script>(.*?)</script>", s, re.S)
    if not css or len(scripts) < 2:
        sys.exit('Unexpected source layout (need 1 <style> and >=2 inline <script>).')
    s = s.replace(css.group(0), '<link rel="stylesheet" href="app.css">', 1)
    for i, body in enumerate(scripts[:2]):
        s = s.replace('<script>' + body + '</script>', '<script src="app%s.js"></script>' % ('' if i == 0 else '2'), 1)
    sw_reg = ("\n;if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))"
              "addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));\n")
    head = ('<meta http-equiv="Content-Security-Policy" content="%s">'
            '<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">' % CSP)
    s = patch(s, '<meta charset="utf-8">', '<meta charset="utf-8">' + head, 'inject CSP')

    # ---- write dist ----
    out = pathlib.Path(a.out)
    out.mkdir(exist_ok=True)
    files = {'index.html': s, 'app.css': css.group(1), 'app.js': scripts[0], 'app2.js': scripts[1] + sw_reg}
    ver = hashlib.sha256(''.join(files.values()).encode()).hexdigest()[:10]
    shell = ['./', 'index.html', 'app.css', 'app.js', 'app2.js', 'manifest.webmanifest', 'icon.svg']
    files['sw.js'] = (
        "const V='cytovision-%s',SHELL=%r;\n"
        "self.addEventListener('install',e=>{e.waitUntil(caches.open(V).then(c=>c.addAll(SHELL)).then(()=>self.skipWaiting()))});\n"
        "self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==V).map(x=>caches.delete(x)))).then(()=>self.clients.claim()))});\n"
        "self.addEventListener('fetch',e=>{const u=new URL(e.request.url);if(e.request.method!=='GET'||u.origin!==location.origin)return;\n"
        "e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(n=>{if(n.ok&&/\\/models\\//.test(u.pathname)){const c=n.clone();caches.open(V).then(x=>x.put(e.request,c))}return n}).catch(()=>caches.match('index.html'))))});\n"
    ) % (ver, shell)
    files['manifest.webmanifest'] = ('{"name":"Cytovision AI","short_name":"Cytovision","start_url":".","display":"standalone",'
                                     '"background_color":"#edf5ff","theme_color":"#1769c2","icons":[{"src":"icon.svg","sizes":"any","type":"image/svg+xml"}]}')
    files['icon.svg'] = ('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1769c2"/>'
                         '<circle cx="32" cy="32" r="14" fill="none" stroke="#fff" stroke-width="5"/><circle cx="32" cy="32" r="5" fill="#ffe1e8"/></svg>')
    files['_headers'] = ('/*\n  Content-Security-Policy: %s; frame-ancestors \'none\'\n  X-Content-Type-Options: nosniff\n'
                         '  Referrer-Policy: no-referrer\n  Permissions-Policy: camera=(self), geolocation=()\n' % CSP)
    for n, c in files.items():
        (out / n).write_text(c, encoding='utf-8')

    t = pathlib.Path('tests'); t.mkdir(exist_ok=True)
    (t / 'app.test.mjs').write_text(TESTS, encoding='utf-8')
    (t / 'smoke.mjs').write_text(SMOKE, encoding='utf-8')
    w = pathlib.Path('.github/workflows'); w.mkdir(parents=True, exist_ok=True)
    (w / 'ci.yml').write_text(WORKFLOW, encoding='utf-8')
    print('Built %s (%s) -> %s/ | tests/ | .github/workflows/ci.yml' % (src.name, ver, out))


if __name__ == '__main__':
    main()
    
