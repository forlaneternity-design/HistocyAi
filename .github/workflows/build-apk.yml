name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, sw.js, manifest.webmanifest, package.json, capacitor.config.json, scripts/**, .github/workflows/build-apk.yml]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Harden app (idempotent) and refresh CSP hashes
        run: python3 scripts/harden.py index.html
      - name: Build gate (scripts parse, CSP hashes match, no inline handlers)
        run: node scripts/check_build.js index.html
      - name: Install Capacitor
        run: npm install
      - name: Copy web app
        run: mkdir -p www && cp index.html www/index.html && cp sw.js manifest.webmanifest www/
      - name: Allow the app to reach a plain-http Connect server (LAN testing)
        run: node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.android=Object.assign({},c.android,{allowMixedContent:true});fs.writeFileSync(f,JSON.stringify(c,null,2));console.log(fs.readFileSync(f,'utf8'))"
      - name: Create Android project
        run: npx cap add android
      - name: Add camera and microphone permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' "$M"
          grep -q 'permission.CAMERA' "$M"
          grep -q 'permission.RECORD_AUDIO' "$M"
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cytovision-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
