name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, package.json, capacitor.config.json, .github/workflows/build-apk.yml]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        run: npm install
      - name: Copy web app
        run: mkdir -p www && cp index.html www/index.html
      - name: Create Android project
        run: npx cap add android
      - name: Add camera permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' "$M"
          grep -q 'permission.CAMERA' "$M"
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cytovision-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
