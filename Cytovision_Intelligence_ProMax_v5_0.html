<!doctype html>
<!-- v5.0.1 pilot-hardening changelog (single-file RUO prototype)
1) Attention index: explicitly relabelled display-only / not validated; no formula change.
2) Test gate: test-split Insights returns before metric computation when the exact configuration lock is absent or mismatched; test burn history remains visible after unlock.
3) Reference standard: removed signing-time diagnosis-to-refDx fallback; v4 migration clears legacy typed labels unless a consensus-derived label exists.
4) Consent: registration requires an explicit non-not-recorded consent basis for non-synthetic cases.
5) Workflow: records timeToDecisionMs, unique regions reviewed/confirmed/rejected and overrideCount on cytotechnologist decision.
6) Gallery encryption: IndexedDB gallery blobs are encrypted/decrypted through AtRest when enabled; enabling migrates existing gallery blobs, disabling decrypts them before removing the key.
Smaller fixes: unique reference-reader IDs, refreshSafety after panel entry, remove unused seededAdmin renderer, and invalidateTest archives then clears the active burn marker.
Limits: this is software guardrail work, not clinical validation, ethics approval, regulatory compliance, or a guarantee that browser storage is tamper-proof.
-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8f2ff"><meta name="color-scheme" content="light dark">
<title>Cytovision AI · Blue Collaborative Research</title>
<style>:root{
  --bg:#edf5ff;--surface:#ffffff;--surface2:#dcecff;--ink:#122b49;--ink2:#526d8a;--line:#b9d2f1;
  --hema:#1769c2;--hema-ink:#ffffff;--hema-soft:#d7e9ff;
  --eosin:#c2415d;--eosin-soft:#ffe1e8;
  --og:#a96618;--og-soft:#fff0d8;
  --lg:#187b68;--lg-soft:#d9f2eb;
  --shadow:0 1px 2px rgba(25,69,100,.06),0 4px 14px rgba(25,69,100,.07);
  --serif:"Noto Serif","Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Roboto","Segoe UI",sans-serif;
  --nav-h:64px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b1728;--surface:#12243b;--surface2:#1a3452;--ink:#edf5ff;--ink2:#b4c8e0;--line:#29496d;
  --hema:#78b7ff;--hema-ink:#08182a;--hema-soft:#234a76;
  --eosin:#ff9db0;--eosin-soft:#51283a;
  --og:#f2bd75;--og-soft:#4d3b25;
  --lg:#6bd8bd;--lg-soft:#19463d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2c1421;--surface:#3b1b2b;--surface2:#51253b;--ink:#fff0f6;--ink2:#e5b9cc;--line:#74415a;
    --hema:#ff8fba;--hema-ink:#2c1421;--hema-soft:#63304a;
    --eosin:#ff9fc3;--eosin-soft:#63304a;
    --og:#f2bd75;--og-soft:#4d3b25;
    --lg:#6bd8bd;--lg-soft:#19463d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:21px}h3{font-size:17px}h4{font-size:15px}
p{margin:0 0 8px}
a{color:var(--hema)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hema);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--ink2)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}.stack-s>*+*{margin-top:8px}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* shell */
#app{display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 10px;background:var(--surface);border-bottom:1px solid var(--line);min-height:56px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:700;font-size:18px}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:var(--ink2);margin-top:-2px}
.topbar .chip-case{margin-left:auto}
main#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px calc(var(--nav-h) + var(--safe-b) + 24px);-webkit-overflow-scrolling:touch}
.page{max-width:1120px;margin:0 auto}
nav#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:20}
nav#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--nav-h);border:0;background:none;color:var(--ink2);font-size:11.5px;cursor:pointer;position:relative}
nav#tabs button svg{width:24px;height:24px}
nav#tabs button[aria-current="page"]{color:var(--hema);font-weight:700}
nav#tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--hema);border-radius:0 0 3px 3px}
nav#tabs .badge-dot{position:absolute;top:9px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:9px;background:var(--eosin);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;font-weight:700}
@media (min-width:900px){
  #app{flex-direction:row}
  nav#tabs{position:static;flex-direction:column;width:92px;border-top:0;border-right:1px solid var(--line);order:-1;padding-top:8px;justify-content:flex-start}
  nav#tabs button{flex:none;min-height:72px}
  nav#tabs button[aria-current="page"]::before{top:18%;bottom:18%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .col{display:flex;flex-direction:column;flex:1;min-width:0;height:100%}
  main#view{padding-bottom:24px}
}
.col{display:contents}
@media (min-width:900px){.col{display:flex}}

.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.gallery-item{min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}.gallery-item img{width:100%;height:118px;object-fit:contain;display:block;background:#e7f3fb}.gallery-item .meta{padding:7px;font-size:11px;overflow-wrap:anywhere}.gallery-actions{display:flex;gap:5px;padding:0 7px 7px;flex-wrap:wrap}.gallery-actions .btn{flex:1;margin:0;min-width:58px}.gallery-review-image{max-width:100%;max-height:55vh;object-fit:contain;display:block;margin:auto;background:#e7f3fb;border-radius:10px}.qc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.qc-metric{padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}.qc-metric b{display:block;font-size:18px}.qc-metric span{font-size:11px;color:var(--muted)}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.card+.card,.card+.stack,.stack+.card{margin-top:12px}
.card h3{margin-bottom:8px}
.flat{background:var(--surface2);border-radius:10px;padding:10px 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:74px}
.kpi b{display:block;font-family:var(--serif);font-size:26px;line-height:1.1;margin-top:2px}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.alert b{color:var(--eosin)}.kpi.ok b{color:var(--lg)}

.note{padding:10px 12px;border-radius:10px;border-left:4px solid var(--hema);background:var(--hema-soft);font-size:13px;margin:8px 0}
.note.warn{border-color:var(--og);background:var(--og-soft)}
.note.bad{border-color:var(--eosin);background:var(--eosin-soft)}
.note.good{border-color:var(--lg);background:var(--lg-soft)}
.note b:first-child{font-weight:700}

/* controls */
label.f{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
label.f:first-child{margin-top:0}
input[type=text],input[type=number],input[type=password],input[type=search],input[type=datetime-local],select,textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--hema);min-height:32px}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--hema);flex:none}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:14px;cursor:pointer;background:var(--surface2);color:var(--ink);text-decoration:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--hema);color:var(--hema-ink)}
.btn.danger{background:var(--eosin);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.icon{padding:0;width:44px}
.btn.sm.icon{width:36px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--hema-soft);border-color:var(--hema);color:var(--hema)}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-height:38px;padding:0 12px;border:0;border-radius:8px;background:none;font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--hema);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:0 10px;border-radius:999px;background:var(--surface2);font-size:12.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
button.chip{cursor:pointer;min-height:34px}
.chip.on{background:var(--hema);color:var(--hema-ink)}
.chip.routine{background:var(--lg-soft);color:var(--lg)}
.chip.high{background:var(--og-soft);color:var(--og)}
.chip.urgent{background:var(--eosin-soft);color:var(--eosin)}
.chip.info{background:var(--hema-soft);color:var(--hema)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);width:56px;height:56px;border-radius:18px;border:0;background:var(--hema);color:var(--hema-ink);box-shadow:0 6px 18px rgba(58,47,143,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:15}
.fab svg{width:26px;height:26px}
@media (min-width:900px){.fab{bottom:24px;right:24px}}
.empty{text-align:center;padding:34px 16px;color:var(--ink2)}
.empty svg{width:44px;height:44px;color:var(--hema);opacity:.7;margin-bottom:8px}
.empty h3{color:var(--ink);margin-bottom:4px}

/* pipeline band */
.band{display:flex;height:46px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.band button{border:0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;cursor:pointer;color:#fff;transition:flex-grow .3s;padding:0 2px;line-height:1.15}
.band button b{font-family:var(--serif);font-size:16px}
.band button.zero{flex-grow:0!important;min-width:26px;opacity:.55}
.stagekey{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

/* case cards */
.case{display:flex;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;width:100%;text-align:left;box-shadow:var(--shadow)}
.case+.case{margin-top:8px}
.case.active{border-color:var(--hema);box-shadow:0 0 0 2px var(--hema-soft)}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--surface2);object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink2);overflow:hidden}
.thumb svg{width:26px;height:26px;opacity:.5}
.case h4{font-size:16px}
.sla{height:5px;border-radius:3px;background:var(--surface2);margin-top:8px;overflow:hidden}
.sla i{display:block;height:100%;background:var(--lg)}
.sla i.warn{background:var(--og)}.sla i.over{background:var(--eosin)}

/* stage */
.stagewrap{position:relative;background:#0e0c1f;border-radius:14px;overflow:hidden;border:1px solid var(--line);touch-action:none}
#stage{display:block;width:100%;height:min(56vh,520px);min-height:280px;touch-action:none;cursor:grab}
#stage.draw{cursor:crosshair}
.stagehud{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;pointer-events:none;gap:8px}
.hud{background:rgba(14,12,31,.72);color:#fff;border-radius:8px;padding:4px 8px;font-size:11.5px;backdrop-filter:blur(4px)}
.stageempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#cfcbf0;text-align:center;padding:20px}
.stageempty svg{width:46px;height:46px;opacity:.7}
.toolbar{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.toolbar .sep{width:1px;background:var(--line);margin:4px 2px;flex:none}
@media (min-width:900px){
  .bench{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,1fr);gap:16px;align-items:start}
  .bench .left{position:sticky;top:0}
  #stage{height:min(66vh,680px)}
}

/* data */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-weight:600;color:var(--ink2);font-size:12px}
.tbl tr.tap{cursor:pointer}
.tbl-wrap{overflow-x:auto}
.bar{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--hema)}
.probrow{display:flex;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.probrow span:first-child{width:38%;min-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.probrow span:last-child{width:48px;text-align:right}
.cm{display:grid;gap:2px;font-size:12px;margin-top:8px}
.cm div{padding:6px 2px;text-align:center;border-radius:4px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cm .h{font-weight:700;color:var(--ink2);background:none}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--ink2);font-size:10px;font-family:var(--sans)}
.gauge{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--lg) 0,var(--og) 55%,var(--eosin) 100%);position:relative;margin:10px 0 4px}
.gauge i{position:absolute;top:-4px;width:4px;height:22px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 22px;font-size:13.5px}
.timeline li::before{content:"";position:absolute;left:5px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface2);border:2px solid var(--line)}
.timeline li.done::before{background:var(--hema);border-color:var(--hema)}
.timeline li::after{content:"";position:absolute;left:9px;top:17px;bottom:-3px;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}

/* overlays */
#sheetHost{position:fixed;inset:0;z-index:50;display:none}
#sheetHost.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(14,12,31,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:up .22s ease-out}
.sheet.center{top:50%;bottom:auto;left:50%;right:auto;transform:translate(-50%,-50%);width:min(440px,92vw);border-radius:16px;animation:none}
@media (min-width:900px){.sheet:not(.center){left:50%;right:auto;transform:translateX(-50%);width:min(640px,96vw)}}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.sheet header h3{flex:1}
.sheet .body{overflow-y:auto;padding:4px 16px calc(16px + var(--safe-b))}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b) + 84px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;pointer-events:none;padding:0 12px}
@media (min-width:900px){#toasts{bottom:24px}}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13.5px;max-width:520px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.bad{background:var(--eosin);color:#fff}.toast.good{background:var(--lg);color:#fff}
.progress{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--hema);transition:width .15s}

/* lock */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
#lock.open{display:flex}
.pinDots{display:flex;gap:12px;margin:6px 0 8px}
.pinDots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--hema)}
.pinDots i.f{background:var(--hema)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.keypad button{height:64px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:600;cursor:pointer}
.keypad button:active{background:var(--hema-soft)}

/* print */
#printRoot{display:none}
@media print{
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block;color:#000;background:#fff;font:12pt/1.4 var(--serif)}
  #printRoot h1{font-size:20pt}#printRoot h2{font-size:14pt;margin-top:14pt}
  #printRoot table{width:100%;border-collapse:collapse}#printRoot td,#printRoot th{border:1px solid #999;padding:4pt 6pt;text-align:left;font-size:10.5pt}
}

/* agent */
.chat{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.bub{max-width:92%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.45;word-wrap:break-word}
.bub.me{align-self:flex-end;background:var(--hema);color:var(--hema-ink);border-bottom-right-radius:4px}
.bub.ag{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;box-shadow:var(--shadow);width:min(100%,640px)}
.agentbar{position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 6px);background:var(--bg);padding:8px 0 4px;margin-top:8px}
@media (min-width:900px){.agentbar{bottom:0}}
.agentbar textarea{min-height:44px;resize:none}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink2);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
/* v3.1 polish */
.topbar{gap:6px;flex-wrap:nowrap}
.brand{font-size:16px;white-space:nowrap;min-width:0}
.brand>div{min-width:0}
.brand small{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .btn.sm.icon{width:34px;min-height:34px;flex:none}
.topbar .chip-case{margin-left:auto;flex:none}
@media (max-width:420px){.brand svg{width:24px;height:24px}.topbar .chip-case{font-size:11.5px;padding:0 8px}}
.chips .chip{max-width:100%;white-space:normal;line-height:1.25;padding-top:3px;padding-bottom:3px}
.chips.scroll .chip{white-space:nowrap}

/* ---------- audit: tamper-evident hash chain ---------- */
function auditUser(){return (S.user.name||'unspecified')+' ('+S.user.role+')'}
function logEvent(c,action,detail){
  if(typeof c==='string')c=S.cases.find(x=>x.id===c);if(!c)return;
  const log=c.auditLog=c.auditLog||[],prev=log.length?log[log.length-1].hash:'GENESIS';
  const e={ts:now(),user:auditUser(),action,detail:detail||''};
  e.prev=prev;e.hash=sha256([prev,e.ts,e.user,e.action,e.detail].join('|'));log.push(e);
}
function verifyChain(c){
  const log=c.auditLog||[];let prev='GENESIS';
  for(let i=0;i<log.length;i++){
    const e=log[i];
    if(!e.hash){prev=null;continue} // legacy v2 entries carry no hash
    if(prev===null){prev=e.hash;continue}
    if(e.prev!==prev||sha256([e.prev,e.ts,e.user,e.action,e.detail].join('|'))!==e.hash)return {ok:false,at:i,n:log.length};
    prev=e.hash;
  }
  return {ok:true,n:log.length,hashed:log.filter(e=>e.hash).length};
}

/* ---------- crypto helpers ---------- */
const HAS_SUBTLE=!!(window.crypto&&crypto.subtle);
const b64=u8=>{let s='';const CH=0x8000;for(let i=0;i<u8.length;i+=CH)s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));return btoa(s)};
const unb64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function deriveKey(pw,salt,iter){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function pinHash(pin,salt){
  if(HAS_SUBTLE){
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:150000,hash:'SHA-256'},km,256);
    return b64(new Uint8Array(bits));
  }
  let h=salt+pin;for(let i=0;i<3000;i++)h=sha256(h);return h;
}
const Auth={
  cfg(){try{return JSON.parse(localStorage.getItem('rc3_pin')||'null')}catch(e){return null}},
  has(){return !!Auth.cfg()},
  async set(pin){const salt=b64(crypto.getRandomValues(new Uint8Array(16)));localStorage.setItem('rc3_pin',JSON.stringify({salt,hash:await pinHash(pin,salt)}))},
  clear(){localStorage.removeItem('rc3_pin');localStorage.removeItem('rc3_fail')},
  lockout(){try{const f=JSON.parse(localStorage.getItem('rc3_fail')||'null');return f&&f.until>Date.now()?f.until-Date.now():0}catch(e){return 0}},
  async check(pin){
    const wait=Auth.lockout();if(wait)return {ok:false,wait};
    const c=Auth.cfg();if(!c)return {ok:true};
    const ok=(await pinHash(pin,c.salt))===c.hash;
    let f={n:0,until:0};try{f=JSON.parse(localStorage.getItem('rc3_fail')||'null')||f}catch(e){}
    if(ok){localStorage.removeItem('rc3_fail');return {ok:true}}
    f.n++;if(f.n>=3)f.until=Date.now()+Math.min(900000,30000*Math.pow(2,f.n-3));
    localStorage.setItem('rc3_fail',JSON.stringify(f));return {ok:false,wait:Auth.lockout(),left:Math.max(0,3-f.n)};
  }
};

function pinPad(host,{title,sub,minLen=4,onSubmit,onCancel}){

  const dots=()=>{$('#ppDots',host).innerHTML=Array.from({length:Math.max(minLen,v.length)},(_,i)=>`<i class="${i<v.length?'f':''}"></i>`).join('')};dots();
  const sub2=t=>{$('#ppSub',host).textContent=t};

    if(k==='ok'){if(v.length<minLen){sub2('Enter at least '+minLen+' digits');return}const cur=v;v='';dots();await onSubmit(cur,sub2);return}

/* ---------- file output: native bridge → share sheet → download ---------- */
async function saveBlob(name,blob,{share=false}={}){
  if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Filesystem){
    try{const FS=Capacitor.Plugins.Filesystem,SH=Capacitor.Plugins.Share,data=b64(new Uint8Array(await blob.arrayBuffer())),r=await FS.writeFile({path:name,data,directory:'CACHE'});
      if(SH){await SH.share({title:name,url:r.uri,dialogTitle:name});return 'capacitor'}toast('Saved '+name,'good');return 'capacitor'}
    catch(e){if(/cancel/i.test(String(e&&e.message)))return 'cancel'}
  }
  if(window.AndroidBridge&&AndroidBridge.saveFile){
    const buf=new Uint8Array(await blob.arrayBuffer());AndroidBridge.saveFile(name,blob.type||'application/octet-stream',b64(buf),!!share);toast(share?'Opening share sheet…':'Saved to Downloads: '+name,'good');return 'bridge';
  }
  if(share&&navigator.canShare){
    try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return 'share'}}catch(e){if(e&&e.name==='AbortError')return 'cancel'}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);toast('Exported '+name,'good');return 'download';
}
const jsonBlob=o=>new Blob([JSON.stringify(o,null,2)],{type:'application/json'});
function csvCell(v){v=v===null||v===undefined?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}

/* PHI guard — catches obvious identifiers before they are stored */
function phiCheck(...texts){
  const t=texts.filter(Boolean).join(' ');const hits=[];
  if(/[\w.+-]+@[\w-]+\.[\w.]+/.test(t))hits.push('an email address');
  if(/(?:\+?\d[\s-]?){9,}/.test(t))hits.push('a phone or ID-length number');
  if(/\b(?:name|mrs?|ms|miss|dr)\.?\s*[:\-]?\s*[A-Z][a-z]+\s+[A-Z][a-z]+/.test(t))hits.push('what looks like a person’s name');
  if(/\b(?:NIN|national id|passport)\b/i.test(t))hits.push('an ID reference');
  return hits;
}

/* ===== Analysis core (pure; runs in a Worker or on the main thread) =====

  const w=msg.w,h=msg.h,n=w*h,d=msg.rgba;

  /* ---------- small helpers ---------- */
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const sortedCopy=a=>Array.from(a).sort((x,y)=>x-y);
  const pctOf=(s,p)=>s.length?s[Math.min(s.length-1,Math.max(0,Math.floor(p*(s.length-1))))]:0;

  const meanOf=a=>{if(!a.length)return 0;let t=0;for(let i=0;i<a.length;i++)t+=a[i];return t/a.length};

  /* ---------- 1. gray-world colour normalisation ---------- */

        if(y>0&&binary[i-w]&&!lab[i-w]){lab[i-w]=cur;st[sp++]=i-w}
        if(y<h-1&&binary[i+w]&&!lab[i+w]){lab[i+w]=cur;st[sp++]=i+w}

  },
  /* --- one full run -> plain object stored on the case --- */
  async run({mode,bmp,analysis,k,maxCells,onProg}){
    if(!this.model)throw new Error('Load a model first');
    const t0=performance.now(),items=this.buildInputs(mode,bmp,analysis,k,maxCells);
    if(!items.length)throw new Error(mode==='cells'?'No nuclei to classify. Run morphometry first (Bench → Cells) or switch mode.':'Nothing to classify.');
    const probs=await this.predictCanvases(items.map(i=>i.cv),onProg),agg=this.aggregate(items,probs);
    return {mode,agg,ms:Math.round(performance.now()-t0),items:items.length,probs};
  }
};

/* Multi-image review: per-image metadata, human review status, notes and basic non-diagnostic QC. */
async function galleryBasicQC(rec){
  const bmp=await decodeBitmap(rec.blob);const max=700,sc=Math.min(1,max/Math.max(bw(bmp),bh(bmp))),w=Math.max(1,Math.round(bw(bmp)*sc)),h=Math.max(1,Math.round(bh(bmp)*sc));

  const d=ctx.getImageData(0,0,w,h).data;let n=0,sum=0,sum2=0,edge=0,edges=0,clipped=0;
  const lum=(i)=>.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,L=lum(i);sum+=L;sum2+=L*L;n++;if(L<8||L>247)clipped++;if(x+1<w){edge+=Math.abs(L-lum(i+4));edges++}if(y+1<h){edge+=Math.abs(L-lum(i+w*4));edges++}}
  const mean=sum/n,contrast=Math.sqrt(Math.max(0,sum2/n-mean*mean)),edgeMean=edge/Math.max(1,edges),clipPct=100*clipped/n;
  const flags=[];if(mean<35)flags.push('very dark');if(mean>220)flags.push('very bright');if(contrast<18)flags.push('low contrast');if(edgeMean<4.5)flags.push('low edge detail / possible blur');if(clipPct>35)flags.push('large clipped-light/dark area');
  return {at:now(),method:'basic-pixel-quality-heuristic-v1',meanBrightness:+mean.toFixed(1),contrast:+contrast.toFixed(1),edgeDetail:+edgeMean.toFixed(2),clippedPercent:+clipPct.toFixed(1),flag:flags.length?'review':'ok',flags,notice:'Heuristic quality indicators only; not a validated focus detector and not a diagnostic result.'};
}

const Demo={
  load(){

    const classes=[['NILM (Negative)',.5],['ASC-US',.12],['ASC-H',.05],['LSIL',.15],['HSIL',.12],['AGC',.03],['Squamous carcinoma',.03]];

    const order=classes.map(c=>c[0]),splits=['train','train','train','val','test'];

      let pred=ref;if(R()>.8){const j=order.indexOf(ref)+(R()<.5?-1:1);pred=order[clamp(j,0,order.length-1)]}
      const score=clamp((abn?.72:.24)+gauss()*.2,.02,.98),abst=R()<.08;
      const recv=new Date(Date.now()-R()*60*864e5),tat=Math.exp(Math.log(arm==='Standard'?30:19)+gauss()*.45)*36e5,done=new Date(recv.getTime()+tat);
      const c=newCase({id,patientKey:pk,sp:'Cervical cytology',pri:R()<.1?'urgent':R()<.25?'high':'routine',arm,split:splits[Math.abs(pk.split('').reduce((a,b)=>a+b.charCodeAt(0),0))%5],
        recv:new Date(recv.getTime()-recv.getTimezoneOffset()*6e4).toISOString().slice(0,16),verified:true,done:done.toISOString(),status:'Verified report',synthetic:true,syntheticRefLabel:ref,dx:ref,
        aiClass:abst?null:pred,aiAbstain:abst,aiProb:abst?null:clamp(.55+R()*.4,0,1),aiScore:score,modelName:'Synthetic',modelVersion:'demo',aiTimestamp:recv.toISOString(),
        ai:{mode:'demo',cells:0,caseClass:abst?null:pred,abstain:abst,aiScore:score,counts:{},items:[]},report:{signedBy:'Demo',signedAt:done.toISOString()}});
      demoTimes(c,recv,done,R,gauss,arm,abn,ref,i);

/* ===== Bench: image → QC → cells → AI → annotate ===== */
let stage=null,worker=null,benchBusy=false,liveRes=null;
const FLAGN=[[1,'Enlarged'],[2,'Dark chromatin'],[4,'Irregular outline'],[8,'High N:C']];
const flagText=f=>FLAGN.filter(([b])=>f&b).map(x=>x[1]).join(', ')||'None';

/* ---- analysis runner (Web Worker with main-thread fallback) ---- */
function getWorker(){
  if(worker)return worker;
  try{
    const src=`const analysisCore=${analysisCore.toString()};onmessage=e=>{try{const r=analysisCore(e.data);postMessage(r,[r.labels.buffer])}catch(err){postMessage({error:String(err&&err.message||err)})}};`;
    worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  }catch(e){worker=null}
  return worker;
}
function runCore(msg){
  return new Promise((res,rej)=>{
    const w=getWorker();
    if(!w){setTimeout(()=>{try{res(analysisCore(msg))}catch(e){rej(e)}},30);return}
    w.onmessage=e=>e.data&&e.data.error?rej(new Error(e.data.error)):res(e.data);
    w.onerror=e=>{worker=null;try{res(analysisCore(msg))}catch(err){rej(err)}};
    w.postMessage(msg,[msg.rgba.buffer]);
  });
}
function compactAnalysis(r,k,params){
  return {v:3,ts:now(),w:r.w,h:r.h,k,params,threshold:r.threshold,separability:r.separability,lowContrast:r.lowContrast,usedSplit:r.usedSplit,
    qc:r.qc,summary:r.summary,umPerPx:r.umPerPx,
    nuclei:r.nuclei.map(o=>({id:o.id,cx:+o.cx.toFixed(1),cy:+o.cy.toFixed(1),area:o.area,areaUm2:o.areaUm2,circ:+o.circ.toFixed(3),solidity:+o.solidity.toFixed(3),ecc:+o.ecc.toFixed(3),
      meanH:+o.meanH.toFixed(3),nc:+o.nc.toFixed(3),flags:o.flags,minX:o.minX,minY:o.minY,maxX:o.maxX,maxY:o.maxY}))};
}
async function analyseCase(c,{silent}={}){
  if(!stage||!stage.img)throw new Error('Load an image first');
  const p={minArea:+($('#pMin')?.value||S.bench.minArea),maxArea:+($('#pMax')?.value||S.bench.maxArea),split:$('#pSplit')?$('#pSplit').checked:S.bench.split};
  S.bench=Object.assign(S.bench||{},p);
  const {cv,ctx,w,h}=drawTo(stage.img,effWorkRes()),k=stage.iw/w,id=ctx.getImageData(0,0,w,h);
  const um=(c.calib&&c.calib.umPerPx)?c.calib.umPerPx*k:0;
  benchBusy=true;paintProgress('Analysing…',null);
  try{
    const t0=performance.now(),r=await runCore({rgba:id.data,w,h,params:{...p,umPerPx:um}});
    r.ms=Math.round(performance.now()-t0);liveRes=r;
    stage.setAnalysis(r,k);
    c.analysis=compactAnalysis(r,k,p);c.quality=r.qc.verdict;c.stages.morph=now();
    logEvent(c,'Morphometry run',`${r.nuclei.length} nuclei, QC ${r.qc.verdict}, threshold ${r.threshold}${r.usedSplit?', watershed':''}`);
    saveCase(c);if(!silent)toast(`${r.nuclei.length} nuclei found · QC ${r.qc.verdict}`,'good');
  }finally{benchBusy=false;paintProgress(null)}
  paintPanel();
}
function paintProgress(txt,frac){

  el.innerHTML=`<div class="note"><b>${esc(txt)}</b>${frac===null?'':`<div class="progress" style="margin-top:6px"><i style="width:${Math.round(frac*100)}%"></i></div>`}</div>`;

async function ingestImage(c,file){
  if(!file)return;
  if(c.analysis||c.annotations.length||c.ai){
    if(!await confirmBox('Replacing the image clears this case’s measurements, AI result and annotations (they would no longer match). The audit log is kept.',{ok:'Replace image',danger:true,title:'Replace image'}))return;
  }
  paintProgress('Reading image…',null);
  try{
    const bmp=await decodeBitmap(file),{cv,w,h}=drawTo(bmp,S.settings.storeMaxSide);
    await DB.delTiles(c.id);c.hiRes=null;const big=Math.max(bw(bmp),bh(bmp));
    if(DB.ok&&big>S.settings.storeMaxSide&&big<=12000){try{paintProgress('Building hi-res tiles…',0);c.hiRes=await buildPyramid(c.id,bmp,f=>paintProgress('Building hi-res tiles…',f))}catch(e){c.hiRes=null;toast('Hi-res tiles skipped (low memory). Using standard view.')}}
    const blob=await canvasBlob(cv,'image/jpeg',.92),th=drawTo(cv,160);
    await DB.putImage(c.id,blob,w,h);
    c.thumb=th.cv.toDataURL('image/jpeg',.7);c.analysis=null;c.ai=null;c.aiClass=null;c.aiAbstain=false;c.aiProb=null;c.aiScore=null;c.annotations=[];mark(c,'imgStart');c.stages.imaging=now();c.stages.morph=null;c.stages.ai=null;c.imgMeta={w,h,orig:[bw(bmp),bh(bmp)],name:file.name||'',bytes:blob.size,sha:''};
    try{const buf=new Uint8Array(await blob.arrayBuffer());c.imgMeta.sha=sha256(String.fromCharCode.apply(null,buf.subarray(0,Math.min(buf.length,65536)))+buf.length).slice(0,16)}catch(e){}

ACT.runAI=async()=>{
  const c=active();if(!c||!need('runai'))return;if(!AI.model||!stage.img)return;
  if(c.quality==='Poor'&&!c.qcOverride){
    const why=await askText('QC gate','This image failed quality control, so AI output would give false confidence. To run anyway, state why (logged; forces second review).',{area:true,ok:'Override and run'});
    if(!why||!why.trim())return toast('AI not run: fix the image (Bench → Cells shows what to do)','bad');
    c.qcOverride={by:auditUser(),ts:now(),reason:why.trim()};logEvent(c,'QC gate overridden',why.trim().slice(0,120));
  }
  mark(c,'aiStart');
  const labels=AI.meta.labels;if(!labels.length&&!await confirmBox('No class labels are set, so classes will be named “Class 0, 1, …” and abnormal scoring will be wrong. Continue anyway?',{ok:'Continue'}))return;
  benchBusy=true;
  try{
    const a=c.analysis;const r=await AI.run({mode:S.settings.aiMode,bmp:stage.img,analysis:a,k:a?a.k:1,maxCells:S.settings.maxCells,onProg:(n,t)=>paintProgress('Classifying '+n+' / '+t,n/t)});
    const g=r.agg;c.ai={tta:!!AI.meta.tta,modelHash:AI.meta.sha||'',prepVersion:'rapidcyt-prep-1',mode:r.mode,ms:r.ms,items:r.items,caseClass:g.caseClass,abstain:g.abstain,aiScore:g.aiScore,confidentFrac:g.confidentFrac,counts:g.counts,threshold:AI.meta.threshold,
      rows:g.rows.slice(0,400).map(x=>({x:Math.round(x.x),y:Math.round(x.y),r:Math.round(x.r),label:x.label,p:+x.p.toFixed(3),ab:x.ab,pAbn:+x.pAbn.toFixed(3),sev:x.sev,rect:x.rect,nid:x.nid}))};
    c.aiAbstain=g.abstain;c.aiClass=g.caseClass;c.aiProb=g.caseProb;c.aiScore=g.aiScore;c.modelName=AI.meta.name||'Unnamed model';c.modelVersion=AI.meta.version||'unspecified';c.datasetVersionUsed=c.datasetVersion||'';c.aiTimestamp=now();c.stages.ai=now();mark(c,'aiEnd');refreshSafety(c);
    stage.setAIMarks(AI.marks(g.rows));logEvent(c,'AI triage run',`${c.modelName} ${c.modelVersion}, mode ${r.mode}, ${r.items} inputs, ${g.abstain?'abstained':g.caseClass}`);saveCase(c);renderNav();
  }catch(e){toast(e.message,'bad')}finally{benchBusy=false;paintProgress(null);paintPanel()}
};
ACT.explain=async()=>{
  const c=active();if(!c.ai||!c.ai.rows.length)return;const rows=c.ai.rows.filter(r=>!r.ab).sort((a,b)=>b.pAbn-a.pAbn),row=rows[0]||c.ai.rows[0];
  paintProgress('Computing heatmap…',null);
  try{const cv=await AI.saliency(stage.img,row,stage.iw,stage.ih);stage.setSaliency(cv);stage.setLayer('sal',true);stage.zoomToBox(row.x-row.r,row.y-row.r,row.x+row.r,row.y+row.r,1.5);toast('Heatmap on the top finding','good')}
  catch(e){toast('Heatmap failed: '+e.message,'bad')}finally{paintProgress(null)}
};

  const dur=(i)=>{const t=stg[i][1];if(!t)return '';for(let j=i-1;j>=0;j--)if(stg[j][1])return fmtDur(new Date(t)-new Date(stg[j][1]));return ''};
  return `${S.user.role==='Pathologist'?briefingHTML(c):''}${secondReviewCard(c)}${lk?'<div class="note good"><b>Verified and locked.</b> Use Report → Amend to change the outcome.</div>':''}
  <div class="card"><h3>Findings so far</h3>${aiBox}${anBox}

   <label class="f" for="paD">Decision versus AI and cytotechnologist</label><select id="paD" ${lk||!can('path')?'disabled':''}>${opt(['Pending','Confirms prior finding','Overrides prior finding (explain below)'],c.pathDecision)}</select>

ACT.markPrep=()=>{const c=active();if(!need('edit'))return;c.stages.prep=now();logEvent(c,'Slide prepared','');saveCase(c);paintReview()};
ACT.saveReview=async()=>{
  const c=active();if(!c||c.verified)return;const cy=$('#cyD').value,cyn=$('#cyN').value,ps=$('#paS').value,pd=$('#paD').value,pn=$('#paN').value,rf=c.refDx||'';
  if(cy.startsWith('Disagree')&&!cyn.trim())return toast('Explain why you are overriding the AI result','bad');
  if(pd.startsWith('Overrides')&&!pn.trim())return toast('Explain the override in the pathologist note','bad');
  const before=JSON.stringify([c.cytoDecision,c.path,c.pathDecision,c.refDx]),previousPathDecision=c.pathDecision||'';
  if(can('path')&&pd.startsWith('Overrides')&&!(c.disagreements||[]).some(d=>d.src==='review'&&d.reason===pn))recordDisagreement(c,'review',pn);
  if(can('cyto')){c.cytoDecision=cy;c.cytoNote=cyn;if(cy!=='Pending'&&!c.stages.cyto)c.stages.cyto=now()}
  if(can('path')){c.path=ps;c.pathDecision=pd;c.pathNote=pn;if(pd.startsWith('Overrides')&&!previousPathDecision.startsWith('Overrides')){c.workflow=Object.assign({timeToDecisionMs:null,regionsReviewed:0,regionsConfirmed:0,regionsRejected:0,overrideCount:0},c.workflow||{});c.workflow.overrideCount=(c.workflow.overrideCount||0)+1}if(ps==='Completed'&&!c.stages.pathologist){c.stages.pathologist=now();c.pathBy=S.user.name||S.user.role}}
  refreshSafety(c);
  // refDx is derived exclusively from refConsensus; it is never manually assigned here.
  c.status=c.path==='Completed'?'Ready for reporting':c.cytoDecision.includes('Disagree')?'Awaiting pathologist':'Human review';
  logEvent(c,'Review saved',`cyto: ${c.cytoDecision} | path: ${c.path}/${c.pathDecision}${c.refDx?' | ref: '+c.refDx:''}`);saveCase(c);renderNav();toast('Review saved','good');paintReview();
};

  <h2>Supporting data</h2><table><tr><th>Image quality</th><td>${esc(c.quality)} (${esc(c.humanQC||'not confirmed')})</td></tr>
  ${s?`<tr><th>Nuclei measured</th><td>${s.count}; attention index DISPLAY ONLY — NOT VALIDATED: ${s.band}${s.index!==null?' ('+s.index+')':''}</td></tr>`:''}

   ${cal.bins.filter(b=>b.n).map(b=>`<circle cx="${px(b.pred)}" cy="${py(b.obs)}" r="${3+Math.min(7,Math.sqrt(b.n))}" fill="var(--hema)" opacity=".75"/>`).join('')}
   ${[0,.5,1].map(v=>`<text x="${px(v)}" y="${H-m+13}" text-anchor="middle">${v}</text><text x="${m-6}" y="${py(v)+3}" text-anchor="end">${v}</text>`).join('')}

function rasterAnn(anns,iw,ih,G=200){
  const g=new Uint8Array(G*G),sx=G/iw,sy=G/ih;
  for(const a of anns){const P=annPolygon(a);const xs=P.map(p=>p[0]*sx),ys=P.map(p=>p[1]*sy),x0=Math.max(0,Math.floor(Math.min(...xs))),x1=Math.min(G-1,Math.ceil(Math.max(...xs))),y0=Math.max(0,Math.floor(Math.min(...ys))),y1=Math.min(G-1,Math.ceil(Math.max(...ys)));

/* ===== Cytovision Agent =====
   Two brains, one tool registry:
   1. Local copilot  – rule-based, offline, nothing leaves the device.
   2. Optional LLM   – user-supplied key/endpoint, sees only pseudonymised case IDs and aggregate numbers.
   Hard rule: the agent can read, rank, queue, draft and propose. It can never sign, amend, delete, change roles or PINs.
   Every write goes through an on-screen Approve / Decline card. */

/* ---------- multitasking job queue ---------- */
const Jobs={list:[],running:false,
  count(){return this.list.filter(j=>j.status==='queued'||j.status==='running').length},
  add(name,total,fn){const j={id:uid(),name,total,done:0,status:'queued',msg:'',cancel:false,errors:[],fn};this.list.unshift(j);paintJobs();renderTop();this.pump();return j},
  async pump(){
    if(this.running)return;this.running=true;
    for(;;){
      const j=this.list.slice().reverse().find(x=>x.status==='queued');if(!j)break;
      j.status='running';paintJobs();
      try{j.result=await j.fn(j);j.status=j.cancel?'cancelled':'done'}catch(e){j.status='failed';j.msg=e.message}
      paintJobs();renderTop();renderNav();
      if(S.view==='agent')agentSay(`<b>${esc(j.name)}</b> ${j.status}. ${j.result?`${j.result.ok} done${j.result.fail?`, ${j.result.fail} failed`:''}.`:esc(j.msg)}${j.errors.length?`<div class="tiny muted">${esc(j.errors.slice(0,3).join(' · '))}</div>`:''}`);
      else toast(j.name+' '+j.status,j.status==='done'?'good':'bad');
    }
    this.running=false;
  }
};
function paintJobs(){
  const el=$('#jobsBox');if(!el)return;const l=Jobs.list.slice(0,4);
  el.innerHTML=l.length?l.map(j=>`<div class="flat" style="margin-bottom:6px"><div class="row between"><b class="small">${esc(j.name)}</b><span class="chip ${j.status==='done'?'routine':j.status==='failed'?'urgent':'info'}">${j.status}</span></div>${j.total?`<div class="progress" style="margin:6px 0 2px"><i style="width:${Math.round(j.done/j.total*100)}%"></i></div><div class="tiny muted">${j.done}/${j.total} ${esc(j.msg)}</div>`:''}${j.status==='running'||j.status==='queued'?`<button class="btn sm ghost" data-act="jobCancel" data-id="${j.id}" style="margin-top:4px">Cancel</button>`:''}</div>`).join(''):'';
}
ACT.jobCancel=el=>{const j=Jobs.list.find(x=>x.id===el.dataset.id);if(j){j.cancel=true;if(j.status==='queued'){j.status='cancelled'}paintJobs();renderTop()}};

async function handleLocal(text){

/* ===== Workflow engine: Time-to-Diagnosis, delay detection, prediction, safety, next best action ===== */
const POLICY_DEFAULT={secondOnDisagree:true,secondOnHighRiskNeg:true,secondOnAbstainNeg:true,secondOnPoorQC:true,secondOnHighMorphNeg:true,rescreenPct:10,minReviewSec:8,aiHi:.6,aiLo:.2,uncertHi:.45,fastLane:true};

 {k:'imaging',n:'Imaging',kind:'work',owner:'Imaging',frac:.10,now:'Prepared, awaiting imaging'},
 {k:'analysis',n:'Analysis',kind:'work',owner:'Cytotechnologist',frac:.05,now:'Imaging completed, analysis pending'},
 {k:'cytoWait',n:'Waiting for cytotechnologist',kind:'wait',owner:'Cytotechnologist',frac:.12,now:'Waiting for cytotechnologist review'},
 {k:'cyto',n:'Cytotechnologist review',kind:'work',owner:'Cytotechnologist',frac:.13,now:'Cytotechnologist review in progress'},
 {k:'pathWait',n:'Waiting for pathologist',kind:'wait',owner:'Pathologist',frac:.25,now:'Waiting for pathologist review'},
 {k:'path',n:'Pathologist review',kind:'work',owner:'Pathologist',frac:.05,now:'Pathologist review in progress'},
 {k:'verify',n:'Report and verification',kind:'work',owner:'Pathologist',frac:.10,now:'Reviewed, awaiting report verification'}
];
const SEGIDX=Object.fromEntries(SEG.map((s,i)=>[s.k,i]));
const CYTO_KEYS=['imaging','analysis','cytoWait','cyto'],PATH_KEYS=['pathWait','path','verify'];
function T(c){
  const t=c.ts||{},s=c.stages||{},d=x=>x?new Date(x).getTime():null,recv=d(c.recv);
  return {collected:d(c.collected||t.collected),received:recv,accessioned:d(t.accessioned)||recv,prepEnd:d(s.prep)||d(t.prepEnd),imgEnd:d(s.imaging),
    aiEnd:d(s.ai)||d(s.morph),cytoStart:d(t.cytoStart),cytoEnd:d(s.cyto),pathStart:d(t.pathStart),pathEnd:d(s.pathologist),verifiedAt:c.verified?d(c.done):null};
}
function stageDurations(c){
  const m=T(c),out=[];let prev=null;
  for(let i=0;i<ORDER.length;i++){const k=ORDER[i];if(m[k]===null||m[k]===undefined||isNaN(m[k]))continue;
    if(prev!==null&&i>0)out.push({...SEG[i-1],ms:Math.max(0,m[k]-m[prev]),from:prev,to:k});prev=k}
  return out;
}
function tatBreakdown(c){
  const segs=stageDurations(c),wait=segs.filter(s=>s.kind==='wait').reduce((a,s)=>a+s.ms,0),work=segs.filter(s=>s.kind==='work').reduce((a,s)=>a+s.ms,0);
  const sla=slaHours(c)*36e5;let worst=null;segs.forEach(s=>{if(s.k==='transport')return;const r=s.ms/Math.max(1,SEG[SEGIDX[s.k]].frac*sla);if(!worst||r>worst.r)worst={...s,r}});
  const meas=c.active||{},handsOn=((meas.cyto||0)+(meas.path||0)+(meas.other||0))*1000;
  return {segs,waitMs:wait,workMs:work,totalMs:wait+work,handsOnMs:handsOn,bottleneck:worst};
}
function curState(c){
  if(c.verified)return {done:true};
  const m=T(c);
  if(c.referral&&c.referral.direction==='outgoing'&&c.referral.status==='requested'){
    const since=new Date(c.referral.requestedAt).getTime(),w=Date.now()-since,b=(c.referral.dueHours||48)*36e5;
    return {key:'referral',label:'Awaiting expert opinion from '+(c.referral.to||'expert'),owner:'Referral expert',since,waitingMs:w,budgetMs:b,ratio:w/b,delayed:w>b,seg:{k:'referral',n:'Expert referral',kind:'wait'}};
  }
  let idx=-1;for(let i=0;i<ORDER.length;i++)if(m[ORDER[i]]!==null&&m[ORDER[i]]!==undefined)idx=i;
  const ni=Math.max(2,idx+1);if(ni>=ORDER.length)return {done:true};
  const seg=SEG[ni-1],since=m[ORDER[idx]]||Date.now(),w=Math.max(0,Date.now()-since),sla=slaHours(c)*36e5,b=Math.max(60000,seg.frac*sla);
  return {key:seg.k,label:seg.now,owner:seg.owner,since,waitingMs:w,budgetMs:b,ratio:w/b,delayed:w>b,seg};

const roleOwns=(role,k)=>role==='Cytotechnologist'?CYTO_KEYS.includes(k):role==='Pathologist'?PATH_KEYS.includes(k):true;

/* ---------- history-based estimates ---------- */
let _hist=null,_histKey='';
function histStats(){
  const pool=S.cases.filter(c=>c.verified&&(S.useSynth||!c.synthetic)),key=pool.length+'|'+S.useSynth+'|'+(pool[pool.length-1]&&pool[pool.length-1].done);
  if(_hist&&_histKey===key)return _hist;
  const by={};pool.forEach(c=>stageDurations(c).forEach(s=>{(by[s.k]||(by[s.k]=[])).push(s.ms)}));
  const q=(a,p)=>{const s=[...a].sort((x,y)=>x-y);return s.length?s[Math.min(s.length-1,Math.floor(p*(s.length-1)))]:null};
  _hist={n:pool.length,by,med:(k,sla)=>{const a=by[k];return a&&a.length>=5?q(a,.5):(SEG[SEGIDX[k]].frac*sla*.5)},p90:(k)=>{const a=by[k];return a&&a.length>=5?q(a,.9):null},has:k=>by[k]&&by[k].length>=5};
  _histKey=key;return _hist;

/* ---------- safety engine ---------- */
const negImpr=c=>!!c.cytoImpression&&/negative|benign/i.test(c.cytoImpression);

function safetyEval(c){
  const P=pol(),req=[],adv=[],plan=(typeof aiPlan==='function')?aiPlan(c):null;
  const sc=plan&&plan.available?plan.calibrated:null;
  if(P.secondOnDisagree&&(c.cytoDecision||'').startsWith('Disagree'))req.push({k:'disagree',text:'Cytotechnologist and AI disagree'});
  if(P.secondOnHighRiskNeg&&negImpr(c)&&sc!==null&&sc>=P.aiHi)req.push({k:'highrisk',text:'AI abnormal score '+f2(sc,2)+' but impression is negative'});
  if(P.secondOnAbstainNeg&&negImpr(c)&&c.ai&&c.aiAbstain)req.push({k:'abstain',text:'AI abstained and impression is negative'});
  if(P.secondOnHighMorphNeg&&negImpr(c)&&c.analysis&&c.analysis.summary.band==='High')req.push({k:'morph',text:'High morphometric attention but impression is negative'});
  if(P.secondOnPoorQC&&c.qcOverride)req.push({k:'poorqc',text:'AI/analysis run on an image that failed QC (override)'});
  if(negImpr(c)&&rescreenPick(c))req.push({k:'rescreen',text:'Selected for routine negative rescreen ('+P.rescreenPct+'% quality sample)'});
  const act=((c.active||{}).cyto||0);
  if(c.stages.cyto&&plan&&plan.regions&&plan.regions.length>0&&act>0&&act<P.minReviewSec)adv.push({k:'fast',text:'Very short hands-on review ('+Math.round(act)+' s) for a case with flagged regions'});
  if(c.pathDecision&&c.pathDecision.startsWith('Overrides'))adv.push({k:'override',text:'Pathologist overrode earlier finding — model-improvement case'});
  if(c.ai&&c.aiAbstain)adv.push({k:'abst',text:'AI abstained — hard case'});

}
function refreshSafety(c){
  const e=safetyEval(c),sr=c.secondReview||(c.secondReview={required:false,reasons:[],done:null,by:'',waived:false});
  const had=sr.required;sr.required=e.required;sr.reasons=e.reasons.map(r=>r.text);sr.advisory=e.advisory.map(r=>r.text);
  if(e.required&&!had&&!sr.done)logEvent(c,'Second review required',sr.reasons.join('; '));
  return sr;
}
const secondPending=c=>{const s=c.secondReview;return !!(s&&s.required&&!s.done&&!s.waived)};

/* ---------- triage v2 (explainable; uses no protected patient characteristics) ---------- */
function triageBase(c){
  if(c.verified)return {score:-1,reasons:[]};
  let s=0;const r=[];
  if(c.pri==='urgent'){s+=50;r.push('urgent request')}else if(c.pri==='high'){s+=25;r.push('high priority')}
  const sl=slaState(c);if(sl.over){s+=30;r.push('past its '+slaHours(c)+' h target')}else if(sl.pct>.6){s+=25*sl.pct;r.push(Math.round(sl.pct*100)+'% of target time used')}
  const plan=aiPlan(c);
  if(plan.available){const sc=plan.calibrated;if(sc!==null){s+=20*sc;if(sc>=.6)r.push('AI abnormal score '+f2(sc,2))}if(plan.uncertainty>=pol().uncertHi){s+=8;r.push('AI uncertain — needs a person')}}
  if(c.aiAbstain){s+=6}
  const an=c.analysis&&c.analysis.summary;if(an&&an.band==='High'){s+=15;r.push('high morphometric attention')}else if(an&&an.band==='Moderate'){s+=7;r.push('moderate attention')}

  if((c.flag||'').includes('Suspicious')||(c.flag||'').includes('Priority')){s+=15;r.push('flagged by reviewer')}
  if(secondPending(c)){s+=8;r.push('second review pending')}
  if(c.followUp&&c.followUp.status==='needed'){s+=6;r.push('follow-up needed')}
  if(c.referral&&c.referral.status==='requested'){s+=10;r.push('expert opinion requested')}
  if(c.annotations.length>=3){s+=3;r.push('complex case (many annotations)')}

}
function mkCtx(){
  const open=S.cases.filter(c=>!c.verified&&(S.useSynth||!c.synthetic)),H=histStats(),states=new Map(),base=new Map();
  open.forEach(c=>{states.set(c.id,curState(c));base.set(c.id,triageBase(c))});
  const inState=k=>open.filter(c=>{const s=states.get(c.id);return s&&s.key===k});
  return {open,states,base,H,
    queueAhead(c,k){const me=base.get(c.id).score;return inState(k).filter(o=>o.id!==c.id&&(base.get(o.id).score>me||(base.get(o.id).score===me&&new Date(o.recv)<new Date(c.recv)))).length},

function predictCase(c,ctx){
  if(c.verified)return null;ctx=ctx||mkCtx();const st=ctx.states.get(c.id)||curState(c);if(!st||st.done)return null;
  if(st.key==='referral'){const rem=Math.max(0,(st.budgetMs-st.waitingMs)*.6);return {remainingMs:rem,eta:new Date(Date.now()+rem),ratio:1,band:st.delayed?'risk':'ok',basedOn:0,assumed:true}}
  const sla=slaHours(c)*36e5,H=ctx.H;let rem=0;
  for(let j=SEGIDX[st.key];j<SEG.length;j++){
    const s=SEG[j];if(s.k==='transport')continue;const med=H.med(s.k,sla);
    let r=j===SEGIDX[st.key]?Math.max(med*.25,med-st.waitingMs):med;
    if(s.k==='cytoWait')r+=ctx.queueAhead(c,'cytoWait')*ctx.workMed('cyto')/staffN('cyto');
    if(s.k==='pathWait')r+=ctx.queueAhead(c,'pathWait')*ctx.workMed('path')/staffN('path');
    rem+=r;
  }
  const total=tatMs(c)+rem,ratio=total/sla;
  return {remainingMs:rem,eta:new Date(Date.now()+rem),ratio,band:ratio>=1?'breach':ratio>=.8?'risk':'ok',basedOn:H.n,assumed:!H.has(st.key)};
}
function rankCases(list,ctx){
  ctx=ctx||mkCtx();
  return list.map(c=>{const b=ctx.base.get(c.id)||triageBase(c),p=c.verified?null:predictCase(c,ctx),reasons=b.reasons.slice();let s=b.score;
    if(p&&p.band==='breach'){s+=20;reasons.push('predicted to breach target')}else if(p&&p.band==='risk'){s+=10;reasons.push('at risk of breaching target')}
    return {c,score:Math.round(s),reasons,pred:p,state:ctx.states.get(c.id)||curState(c)}}).sort((a,b)=>b.score-a.score);
}
function triageScore(c){return triageBase(c)}

function nextAction(c,role){
  role=role||S.user.role;const A=(label,detail,sev,view,extra)=>({label,detail,sev,view,...extra});
  if(c.verified){const f=c.followUp&&c.followUp.status;return f==='needed'?A('Arrange follow-up','Result verified; patient needs follow-up','warn','review',{tab:'share'}):A('Nothing required — continue to next case','Verified','good','focus')}
  const sl=slaState(c),over=sl.over?'OVERDUE · ':'';
  if(!c.thumb&&!c.imgMeta)return A(over+'Capture the slide image','No image attached','warn','bench');
  if(c.quality==='Poor'&&!c.qcOverride)return A(over+'QC failed — reacquire image','Image quality is insufficient for reliable analysis','bad','bench');
  if(!c.analysis)return A(over+'Run image analysis','Image attached, not yet measured','info','bench');
  const plan=aiPlan(c),open=plan.regions.filter(r=>!(c.regionReview||{})[r.key]).length;
  if(role!=='Pathologist'||!c.stages.cyto){
    if(!c.stages.cyto){
      if(open>0)return A(over+`Review ${open} flagged region${open>1?'s':''}`,plan.pathway,'warn','focus');
      return A(over+(role==='Pathologist'?'Waiting for cytotechnologist':'Record your decision'),plan.pathway,role==='Pathologist'?'info':'info','focus');
    }
  }
  if(secondPending(c))return A(over+'Second review needed',(c.secondReview.reasons||[])[0]||'','warn','review');
  if(c.stages.cyto&&!c.verified){
    if(role==='Pathologist')return A(over+'Review and verify',c.cytoImpression?'Cytotech impression: '+c.cytoImpression:'Cytotech review complete','info','focus');
    return A(over+'Send to pathologist','Cytotech review complete — awaiting pathologist','info','review');
  }
  return A('Open case','','info','review');
}

function todayStart(){const d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function median(a){return a.length?Stats.median(a):null}
function workloadCtx(){
  const ctx=mkCtx(),open=ctx.open,ranked=rankCases(open,ctx),cnt={};SEG.forEach(s=>cnt[s.k]=0);cnt.referral=0;
  open.forEach(c=>{const s=ctx.states.get(c.id);if(s&&s.key)cnt[s.key]=(cnt[s.key]||0)+1});
  const cq=open.filter(c=>{const s=ctx.states.get(c.id);return s&&CYTO_KEYS.includes(s.key)}).length,pq=open.filter(c=>{const s=ctx.states.get(c.id);return s&&PATH_KEYS.includes(s.key)}).length;
  const H=ctx.H,sla=72*36e5,mc=H.med('cyto',sla),mp=H.med('path',sla);
  const done=S.cases.filter(c=>c.verified&&(S.useSynth||!c.synthetic)),today=done.filter(c=>new Date(c.done).getTime()>=todayStart());
  const staff={};open.forEach(c=>{const k=c.assignedTo||'Unassigned';staff[k]=(staff[k]||0)+1});
  const atRisk=ranked.filter(x=>x.pred&&x.pred.band==='risk'),breach=ranked.filter(x=>x.pred&&x.pred.band==='breach'),over=open.filter(c=>slaState(c).over);
  const recs=[];
  if(pq>=3&&pq>=cq*2+2){recs.push({sev:'warn',text:`Pathologist queue ${pq} vs cytotech queue ${cq}. Fast-lane sign-off of confirmed negatives would clear pathologist time.`,act:'fastlane'});}
  if(cq>=3&&cq>=pq*2+2)recs.push({sev:'warn',text:`Cytotech queue ${cq} vs pathologist queue ${pq}. Consider redistributing cytotech review or AI-assisted routine review.`});
  const fl=fastLane(ctx).length;if(fl)recs.push({sev:'info',text:`${fl} confirmed-negative case${fl>1?'s are':' is'} eligible for pathologist fast-lane sign-off.`,act:'fastlane'});
  if(over.length)recs.push({sev:'bad',text:`${over.length} case${over.length>1?'s are':' is'} already overdue.`,act:'overdue'});
  if(atRisk.length+breach.length)recs.push({sev:'warn',text:`${atRisk.length+breach.length} case${atRisk.length+breach.length>1?'s are':' is'} predicted to reach or exceed target.`,act:'risk'});
  const poor=open.filter(c=>c.quality==='Poor'&&!c.qcOverride).length;if(poor)recs.push({sev:'warn',text:`${poor} image${poor>1?'s':''} failed QC and need reacquisition.`,act:'qc'});
  const nosr=open.filter(secondPending).length;if(nosr)recs.push({sev:'warn',text:`${nosr} case${nosr>1?'s':''} waiting for mandatory second review.`});
  const ivs=[];
  if(pq>0)ivs.push(`Adding one pathologist for 3 h could clear about ${Math.max(1,Math.round(3*36e5/Math.max(mp,6e4)))} cases (estimate from ${H.has('path')?'your history':'assumed'} review time).`);
  if(cq>0)ivs.push(`Adding one cytotechnologist for 3 h could clear about ${Math.max(1,Math.round(3*36e5/Math.max(mc,6e4)))} cases.`);
  if(fl>0)ivs.push(`Fast-lane sign-off of ${fl} eligible negatives saves roughly ${fmtDur(fl*Math.max(mp*.4,6e4))} of pathologist review time.`);
  return {ctx,open,ranked,cnt,cq,pq,mc,mp,done,today,staff,atRisk,breach,over,recs,ivs,poor};
}
function fastLane(ctx){
  if(!pol().fastLane)return [];ctx=ctx||mkCtx();
  return ctx.open.filter(c=>c.stages.cyto&&negImpr(c)&&c.quality!=='Poor'&&!secondPending(c)&&(c.path!=='Completed')&&!(c.secondReview&&c.secondReview.required&&!c.secondReview.done)&&!(c.aiAbstain)&&(()=>{const p=aiPlan(c);return !p.available||(p.calibrated!==null&&p.calibrated<pol().aiHi)})());
}
function tatTrend(){
  const pool=S.cases.filter(c=>c.verified&&(S.useSynth||!c.synthetic)),now_=Date.now(),D=864e5;
  const rec=pool.filter(c=>now_-new Date(c.done)<=7*D),prev=pool.filter(c=>{const a=now_-new Date(c.done);return a>7*D&&a<=21*D});
  if(rec.length<4||prev.length<4)return {ok:false,msg:`Need at least 4 verified cases in each of the last 7 days and the 2 weeks before (have ${rec.length} and ${prev.length}).`};
  const segMed=(cs)=>{const by={};cs.forEach(c=>stageDurations(c).forEach(s=>{(by[s.k]||(by[s.k]=[])).push(s.ms)}));return by};
  const A=segMed(rec),B=segMed(prev),rows=[];
  SEG.forEach(s=>{if(A[s.k]&&B[s.k]&&A[s.k].length>=3&&B[s.k].length>=3){const a=median(A[s.k]),b=median(B[s.k]);rows.push({k:s.k,n:s.n,now:a,before:b,delta:a-b,pct:b?((a-b)/b):null,owner:s.owner})}});
  rows.sort((x,y)=>y.delta-x.delta);const ta=median(rec.map(tatMs)),tb=median(prev.map(tatMs));
  return {ok:true,recentMedian:ta,priorMedian:tb,change:tb?(ta-tb)/tb:null,rows,top:rows[0]};
}

/* ===== AI triage plan: pathway, urgency, uncertainty, reasons, regions. Decision support only — never a diagnosis. ===== */
function regionsOf(c){
  const out=[],ai=c.ai&&c.ai.mode!=='demo'?c.ai:null,an=c.analysis,k=an?an.k:1,by=new Map();
  if(ai&&ai.rows)ai.rows.forEach((r,i)=>{
    if(r.ab)return;const abn=Stats.isAbn(r.label);if(!abn&&(r.pAbn||0)<.5)return;
    const reg={key:r.nid?'n'+r.nid:'a'+i,kind:'ai',x:r.x,y:r.y,r:Math.max(14,(r.r||20)*.5),label:r.label,p:r.p,score:r.pAbn||r.p,text:`AI suggestion: ${r.label} (${pct(r.p,0)} confidence)`,nid:r.nid,rect:r.rect};
    out.push(reg);if(r.nid)by.set(r.nid,reg);
  });
  if(an)an.nuclei.forEach(o=>{
    const nf=[1,2,4,8].filter(b=>o.flags&b).length;if(nf<2)return;const ex=by.get(o.id),txt=flagText(o.flags);
    if(ex){ex.text+=' · '+txt;ex.score=Math.max(ex.score||0,.6+nf*.08);ex.morph=o;return}
    out.push({key:'n'+o.id,kind:'morph',x:o.cx*k,y:o.cy*k,r:Math.max(14,Math.sqrt(o.area/Math.PI)*k*2),label:'Atypical features',p:null,score:.4+nf*.1,text:'Measured: '+txt,nid:o.id,morph:o});
  });
  return out.sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,40);
}
function aiPlan(c){
  const P=pol(),ai=c.ai&&c.ai.mode!=='demo'?c.ai:null,an=c.analysis&&c.analysis.summary,regions=regionsOf(c);
  const out={available:!!ai,regions,reasons:[],uncertainty:null,calibrated:null,abnProb:null,confidence:null,urgency:'Routine',pathway:'Standard cytotechnologist review',key:'std',secondRec:false,label:'AI suggestion — unverified'};
  if(ai){
    out.calibrated=calScore(c.aiScore);out.abnProb=c.aiScore;const rows=ai.rows||[],mt=rows.length?rows.reduce((s,r)=>s+r.p,0)/rows.length:null,ab=rows.length?rows.filter(r=>r.ab).length/rows.length:1;
    out.confidence=mt;out.uncertainty=mt===null?1:Math.min(1,(1-mt)*.7+ab*.6);
    if(out.calibrated!==null)out.reasons.push(`Abnormal-cell score ${f2(out.calibrated,2)}${S.settings.usePlatt?' (calibrated)':''}`);
    if(c.aiAbstain)out.reasons.push('AI abstained: too few inputs cleared the confidence threshold');else if(c.aiClass)out.reasons.push(`Most frequent confident class: ${c.aiClass}`);
  }
  if(an){out.reasons.push(`${an.attentionCount} of ${an.count} nuclei show two or more atypical features (attention ${an.band.toLowerCase()})`)}
  if(regions.length)out.reasons.push(`${regions.length} region${regions.length>1?'s':''} flagged for attention`);
  const qcPoor=c.quality==='Poor'&&!c.qcOverride;
  if(qcPoor){out.key='recapture';out.pathway='Reacquire image — QC failed';out.urgency=c.pri==='urgent'?'Urgent':'Routine';out.reasons.unshift('Image quality insufficient for reliable analysis');out.available=false;return out}
  if(!ai&&!an){out.pathway='Standard cytotechnologist review (no analysis yet)';return out}
  const sc=out.calibrated,band=an&&an.band,hi=(sc!==null&&sc>=P.aiHi)||band==='High',unc=c.aiAbstain||(out.uncertainty!==null&&out.uncertainty>=P.uncertHi),
        lo=sc!==null&&sc<=P.aiLo&&(!an||band==='Low'||band==='Insufficient cells')&&!unc;
  if(hi){out.key='expert';out.pathway='Priority: cytotechnologist review, then pathologist';out.urgency=(sc!==null&&sc>=.85)||c.pri==='urgent'?'Urgent':'Priority'}
  else if(unc){out.key='careful';out.pathway='Full cytotechnologist review; second review advised (AI unsure)';out.secondRec=true}
  else if(lo&&P.fastLane){out.key='fast';out.pathway='Fast lane: cytotechnologist confirms, pathologist signs quickly'}
  if(!ai)out.label='Measurement-based triage only (no AI model) — low reliability';
  if(c.pri==='urgent')out.urgency='Urgent';
  return out;
}
const PATH_CHIP={expert:'urgent',careful:'high',fast:'routine',std:'info',recapture:'high'};

}

function caseIndex(c){
  return [c.id,c.acc,c.patientKey,c.sp,c.status,statusChipText(c),priorityOf(c).l,c.aiClass,c.aiAbstain?'abstained':'',c.cytoBy,c.pathBy,c.assignedTo,c.dx,c.refDx,c.cytoImpression,c.recv,c.lab,c.split].join(' ').toLowerCase();
}
function parseQuery(q){const f={},free=[];(q.match(/(\w+):("[^"]+"|\S+)|\S+/g)||[]).forEach(t=>{const m=/^(\w+):(.+)$/.exec(t);if(m)f[m[1].toLowerCase()]=m[2].replace(/"/g,'').toLowerCase();else free.push(t.toLowerCase())});return {f,free}}
function matchCase(c,pq,ctx){
  for(const t of pq.free)if(!caseIndex(c).includes(t))return false;
  for(const [k,v] of Object.entries(pq.f)){
    const has=s=>String(s||'').toLowerCase().includes(v);
    if(k==='status'){const st=ctx&&ctx.states.get(c.id);
      if(v==='verified'){if(!c.verified)return false}else if(v==='open'){if(c.verified)return false}else if(v==='overdue'){if(!slaState(c).over)return false}
      else if(v==='second'){if(!secondPending(c))return false}else if(v==='referral'){if(!c.referral)return false}else if(v==='review'){if(!needsReview(c))return false}
      else if(!has(c.status)&&!has(statusChipText(c)))return false}
    else if(k==='priority'||k==='pri'){if(priorityOf(c).k!==v&&c.pri!==v)return false}
    else if(k==='ai'){const p=c.ai&&c.ai.mode!=='demo';if(v==='none'){if(p)return false}else if(v==='abstained'){if(!c.aiAbstain)return false}else if(v==='abnormal'){if(!(p&&c.aiClass&&Stats.isAbn(c.aiClass)))return false}else if(v==='benign'){if(!(p&&c.aiClass&&Stats.isAbn(c.aiClass)===false))return false}else if(!has(c.aiClass))return false}
    else if(k==='reviewer'||k==='by'){if(!(has(c.cytoBy)||has(c.pathBy)||has(c.assignedTo)))return false}
    else if(k==='dx'){if(!(has(c.dx)||has(c.refDx)||has(c.cytoImpression)))return false}
    else if(k==='date'){if(!String(c.recv).toLowerCase().startsWith(v))return false}
    else if(k==='spec'||k==='specimen'){if(!has(c.sp))return false}
    else if(k==='acc'){if(!has(c.acc))return false}
    else if(k==='id'){if(!has(c.id))return false}
    else if(k==='split'){if(c.split!==v)return false}
    else if(k==='lab'){if(!has(c.lab))return false}
    else if(!caseIndex(c).includes(v))return false;
  }
  return true;
}

function effWorkRes(){return S.settings.lowPower?Math.min(800,S.settings.workRes):S.settings.workRes}
const IMPR_CERV=['Negative for intraepithelial lesion or malignancy','Unsatisfactory / inadequate','Atypical squamous cells (ASC-US)','Atypical squamous cells, cannot exclude HSIL (ASC-H)','Low-grade squamous intraepithelial lesion (LSIL)','High-grade squamous intraepithelial lesion (HSIL)','Atypical glandular cells (AGC)','Suspicious for malignancy','Squamous cell carcinoma','Other / defer to pathologist'];
const IMPR_GEN=['Negative / benign','Non-diagnostic','Atypical','Suspicious for malignancy','Malignant','Other / defer to pathologist'];

/* ---------- report state, draft, gate, finalize ---------- */
function reportStateOf(c){
  if(c.verified)return 'VERIFIED';
  if(c.reportState==='reviewed'||c.stages.pathologist)return 'REVIEWED';
  if((c.reportDraft&&c.reportDraft.dx)||c.cytoImpression)return 'DRAFT';
  return 'NONE';
}
function stateChip(c){const s=reportStateOf(c);return `<span class="chip ${s==='VERIFIED'?'routine':s==='REVIEWED'?'info':'high'}">${s==='NONE'?'NO REPORT':s}</span>`}
function genDraft(c){
  const s=c.analysis&&c.analysis.summary,um=c.analysis&&c.analysis.umPerPx>0,plan=aiPlan(c);
  const dx=['[DRAFT — generated from workflow data. The pathologist must review the slide and replace this text.]',
    c.cytoImpression?`Cytotechnologist impression (human, not yet verified): ${c.cytoImpression}.`:'Cytotechnologist impression: not recorded.','Interpretation: [pathologist to enter]'].join('\n');
  const anc=[`Specimen: ${c.sp}${c.acc?' · '+c.acc:''}.`,`Image quality: ${c.quality}${c.humanQC?' ('+c.humanQC+')':''}.`,
    s?`Measured: ${s.count} nuclei; median nuclear area ${um?f2(s.area.median*c.analysis.umPerPx**2,0)+' µm²':f2(s.area.median,0)+' px²'}; ${s.attentionCount} with two or more atypical features.`:'',
    plan.available?`AI suggestion (unverified, not a diagnosis): ${c.aiAbstain?'abstained':c.aiClass||'—'}.`:'',
    c.annotations.length?`Expert annotations: ${c.annotations.length}.`:''].filter(Boolean).join('\n');
  c.reportDraft={dx,anc,rec:(c.reportDraft&&c.reportDraft.rec)||''};logEvent(c,'Report draft generated','unsigned, from workflow data');saveCase(c);
}
function verifyGate(c,dx,adq){
  if(!dx.trim())return 'Enter the verified final diagnosis';
  if(/\[(AI )?DRAFT/i.test(dx))return 'Remove the “[DRAFT …]” marker after writing the real interpretation';
  if(!adq)return 'Select specimen adequacy';
  if(secondPending(c))return 'Mandatory second review is still pending: '+(c.secondReview.reasons[0]||'');
  return '';
}
async function finalizeReport(c,dx,anc,rec){
  c.dx=dx;c.anc=anc;c.rec=rec;c.verified=true;c.done=now();c.status='Verified report';c.reportState='verified';c.path='Completed';
  if(!c.stages.pathologist)c.stages.pathologist=c.done;c.pathBy=S.user.name||S.user.role;
  const head=(c.auditLog[c.auditLog.length-1]||{}).hash||'';
  c.report={dx,anc,rec,adequacy:c.adequacy,signedBy:auditUser(),signedAt:c.done,model:c.modelName||'none',modelVersion:c.modelVersion||'',modelHash:(c.ai&&c.ai.modelHash)||'',dataset:c.datasetVersionUsed||'',hash:sha256(JSON.stringify([dx,anc,rec,c.done,head]))};
  (c.disagreements||[]).forEach(d=>{if(!d.finalOutcome)d.finalOutcome=dx});
  if(Stats.isAbn(c.refDx)&&c.followUp.status==='none'){c.followUp.status='needed';}
  logEvent(c,'Report verified',`Model: ${c.modelName||'none'} ${c.modelVersion||''} ${c.ai&&c.ai.modelHash?c.ai.modelHash.slice(0,10):''} | hash ${c.report.hash.slice(0,12)}`);saveCase(c);renderNav();
}

/* ---------- at-rest encryption (AES-256-GCM, key from a data passphrase) ---------- */
const AtRest={cfg(){try{return JSON.parse(localStorage.getItem('rc3_atrest')||'null')}catch(e){return null}},on(){return !!this.cfg()},key:null,
  async enc(ab){const iv=crypto.getRandomValues(new Uint8Array(12));return {iv:b64(iv),ct:await crypto.subtle.encrypt({name:'AES-GCM',iv},this.key,ab)}},
  async dec(iv,ct){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},this.key,ct)}};
async function dataUnlockIfNeeded(){
  const cfg=AtRest.cfg();if(!cfg)return;
  await new Promise(res=>{
    const el=$('#lock');el.classList.add('open');
    const draw=(msg)=>{el.innerHTML=`<div style="width:100%;max-width:340px;text-align:center"><h2>Unlock data</h2><p class="muted small">${esc(msg||'Data on this device is encrypted. Enter the data passphrase.')}</p><input id="dpIn" type="password" autocomplete="off" aria-label="Data passphrase" style="margin:10px 0"><button class="btn primary" id="dpGo" style="width:100%">Unlock</button></div>`;
      $('#dpGo').onclick=async()=>{try{const salt=unb64(cfg.salt),key=await deriveKey($('#dpIn').value,salt,cfg.iter),t=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(cfg.check.iv)},key,unb64(cfg.check.ct));if(new TextDecoder().decode(t)!=='rapidcyt-ok')throw 0;AtRest.key=key;DB.atRest=AtRest;el.classList.remove('open');el.innerHTML='';res()}catch(e){draw('Wrong passphrase.')}};
      $('#dpIn').onkeydown=e=>{if(e.key==='Enter')$('#dpGo').click()};setTimeout(()=>$('#dpIn').focus(),50)};draw();
  });
}
(function wrapDB(){
  const o={saveCase:DB.saveCase.bind(DB),loadCases:DB.loadCases.bind(DB),putImage:DB.putImage.bind(DB),getImage:DB.getImage.bind(DB),putTile:null};
  DB.saveCase=async function(c){if(DB.ok&&AtRest.key){const e=await AtRest.enc(new TextEncoder().encode(JSON.stringify(c)));return DB.put('cases',{id:c.id,enc:1,iv:e.iv,ct:e.ct})}return o.saveCase(c)};
  DB.loadCases=async function(){const l=await o.loadCases();if(!AtRest.key)return l.filter(x=>!x.enc);const out=[];for(const r of l){if(r.enc){try{out.push(JSON.parse(new TextDecoder().decode(await AtRest.dec(r.iv,r.ct))))}catch(e){console.warn('decrypt',r.id)}}else out.push(r)}return out};
  DB.putImage=async function(id,blob,w,h){if(DB.ok&&AtRest.key){const e=await AtRest.enc(await blob.arrayBuffer());return DB.put('images',{id,enc:1,iv:e.iv,ct:e.ct,w,h,type:blob.type})}return o.putImage(id,blob,w,h)};

/* Gallery image payloads are included in the at-rest encryption boundary. Metadata remains locally visible. */
(function wrapGalleryAtRest(){
  const rawPut=DB.putCaseImage.bind(DB),rawList=DB.listCaseImages.bind(DB),rawGet=DB.getCaseImage.bind(DB);
  DB.putCaseImage=async function(rec){
    if(AtRest.on()&&!AtRest.key)throw new Error('Unlock the data passphrase before writing gallery images; encrypted storage must not fall back to plaintext.');
    if(DB.ok&&AtRest.key&&rec&&rec.blob){const e=await AtRest.enc(await rec.blob.arrayBuffer());const out=Object.assign({},rec,{enc:1,iv:e.iv,ct:e.ct,blobType:rec.blob.type||rec.mime||'image/jpeg'});delete out.blob;return DB.put('caseImages',out)}

ACT.atrestEnable=async()=>{
  if(!HAS_SUBTLE)return toast('Encryption needs a secure context','bad');if(!DB.ok)return toast('At-rest encryption needs IndexedDB storage','bad');if(!need('settings'))return;

  toast('Encrypting…');await flushAll();const salt=crypto.getRandomValues(new Uint8Array(16)),iter=250000,key=await deriveKey(p,salt,iter),iv=crypto.getRandomValues(new Uint8Array(12));

ACT.atrestDisable=async()=>{

const ONLINE_CFG_KEY='cytovision_online_collab_config_v1',ONLINE_SESSION_KEY='cytovision_online_collab_session_v1';
const OnlineCollab={
 cfg(){try{return Object.assign({url:'',anonKey:'',organizationId:'',targetOrganizationId:''},JSON.parse(localStorage.getItem(ONLINE_CFG_KEY)||'{}'))}catch(e){return {url:'',anonKey:'',organizationId:'',targetOrganizationId:''}}},
 saveCfg(c){localStorage.setItem(ONLINE_CFG_KEY,JSON.stringify(c))},
 session(){try{return JSON.parse(sessionStorage.getItem(ONLINE_SESSION_KEY)||'null')}catch(e){return null}},
 setSession(s){if(s)sessionStorage.setItem(ONLINE_SESSION_KEY,JSON.stringify(s));else sessionStorage.removeItem(ONLINE_SESSION_KEY)},
 async request(path,{method='GET',body=null,query='',auth=true}={}){const c=this.cfg(),ss=this.session();if(!c.url||!c.anonKey)throw new Error('Enter Supabase project URL and public anon key first');const base=c.url.replace(/\/$/,'');const headers={'apikey':c.anonKey,'Content-Type':'application/json'};if(auth){if(!ss?.access_token)throw new Error('Sign in first');headers.Authorization='Bearer '+ss.access_token}else headers.Authorization='Bearer '+c.anonKey;if(method==='POST'||method==='PATCH')headers.Prefer='return=representation';const res=await fetch(base+path+(query?(path.includes('?')?'&':'?')+query:''),{method,headers,body:body===null?undefined:JSON.stringify(body)});const txt=await res.text();let out=null;try{out=txt?JSON.parse(txt):null}catch(e){out={message:txt}}if(!res.ok)throw new Error(out?.message||out?.msg||out?.error_description||out?.error||('Request failed ('+res.status+')'));return out},
 async login(email,password){const c=this.cfg();const out=await this.request('/auth/v1/token',{method:'POST',body:{email,password},query:'grant_type=password',auth:false});if(!out?.access_token||!out?.user?.id)throw new Error('Supabase did not return a valid session');this.setSession({access_token:out.access_token,refresh_token:out.refresh_token,expires_at:Date.now()+(Number(out.expires_in||3600)*1000),user:{id:out.user.id,email:out.user.email}});return out.user},
 async refreshIfNeeded(){let ss=this.session();if(!ss?.access_token)throw new Error('Sign in first');if(ss.expires_at>Date.now()+60000)return ss;if(!ss.refresh_token)throw new Error('Session expired. Sign in again.');const out=await this.request('/auth/v1/token',{method:'POST',body:{refresh_token:ss.refresh_token},query:'grant_type=refresh_token',auth:false});if(!out?.access_token)throw new Error('Session refresh failed; sign in again');ss={access_token:out.access_token,refresh_token:out.refresh_token,expires_at:Date.now()+Number(out.expires_in||3600)*1000,user:{id:out.user.id,email:out.user.email}};this.setSession(ss);return ss},
 async rest(table,method,body,query=''){await this.refreshIfNeeded();return this.request('/rest/v1/'+table,{method,body,query,auth:true})},
 async listReferrals(){const c=this.cfg();if(!c.organizationId)throw new Error('Enter your hospital organization UUID');return this.rest('specialist_referrals','GET',null,'select=id,case_id,from_lab,to_lab,to_specialist,status,question,created_at,organization_id,target_organization_id&or=(organization_id.eq.'+encodeURIComponent(c.organizationId)+',target_organization_id.eq.'+encodeURIComponent(c.organizationId)+')&order=created_at.desc&limit=30')},
 async createReferral(caseId,question){const c=this.cfg(),caseRec=S.cases.find(x=>x.id===caseId),ss=this.session();if(!caseRec)throw new Error('Select a registered case');if(!c.organizationId||!c.targetOrganizationId)throw new Error('Enter both your organization UUID and receiving organization UUID');if(!question.trim())throw new Error('Write a consultation question');if(phiCheck(question).length)throw new Error('Remove possible patient identifiers from the consultation question');const gallery=await DB.listCaseImages(caseId);const body={organization_id:c.organizationId,target_organization_id:c.targetOrganizationId,case_id:caseRec.id,from_lab:S.settings.labName||'Sending laboratory',to_lab:c.targetOrganizationId,to_specialist:'Authorized receiving specialist',status:'requested',question:question.trim(),case_summary:{case_id:caseRec.id,specimen_type:caseRec.sp,priority:caseRec.pri,gallery_image_count:gallery.length,submitted_at:now()},created_by:ss.user.id};const rows=await this.rest('specialist_referrals','POST',body,'select=*');return Array.isArray(rows)?rows[0]:rows},
 async listMessages(referralId){if(!referralId)throw new Error('Enter a referral UUID');return this.rest('specialist_messages','GET',null,'select=id,referral_id,body,author_label,author_role,created_at&referral_id=eq.'+encodeURIComponent(referralId)+'&order=created_at.asc&limit=100')},
 async sendMessage(referralId,bodyText){const c=this.cfg(),ss=this.session();if(!referralId||!bodyText.trim())throw new Error('Referral UUID and message are required');if(phiCheck(bodyText).length)throw new Error('Remove possible patient identifiers from the message');const body={referral_id:referralId,organization_id:c.organizationId,body:bodyText.trim(),author_label:ss.user.email||S.user.name||'Authorized specialist',author_role:S.user.role,created_by:ss.user.id};return this.rest('specialist_messages','POST',body,'select=*')}
};

const COLLAB_KEY='cytovision_collaboration_v1';

function netCollab(){
  const d=collabLoad(),ids=S.cases.map(c=>c.id),selected=S.activeId&&ids.includes(S.activeId)?S.activeId:(ids[0]||''),thread=d.threads[selected]||[],oc=OnlineCollab.cfg(),os=OnlineCollab.session();

   ${os?.access_token?`<div class="note good small">Signed in as ${esc(os.user?.email||'authorized user')} · token is held in this browser session only.</div><div class="row"><button class="btn primary" data-act="onlineRefresh">Refresh online referrals</button><button class="btn ghost" data-act="onlineLogout">Sign out</button></div>`:`<div class="grid2"><div><label class="f" for="ocEmail">Authorized user email</label><input id="ocEmail" type="email" autocomplete="username" placeholder="work email"></div><div><label class="f" for="ocPassword">Password</label><input id="ocPassword" type="password" autocomplete="current-password" placeholder="Supabase Auth password"></div></div><div class="row"><button class="btn primary" data-act="onlineLogin">Save settings & sign in</button></div>`}
   <label class="f" for="ocReferralCase">Case for online referral</label><select id="ocReferralCase">${ids.length?ids.map(id=>`<option value="${esc(id)}" ${id===selected?'selected':''}>${esc(id)}</option>`).join(''):'<option value="">No cases registered</option>'}</select>
   <label class="f" for="ocQuestion">Consultation question (de-identified)</label><textarea id="ocQuestion" maxlength="3000" placeholder="State the specialist question; do not include patient identifiers."></textarea><div class="row"><button class="btn primary" data-act="onlineCreateReferral" ${os?.access_token&&ids.length?'':'disabled'}>Create online referral</button><button class="btn" data-act="onlineRefresh" ${os?.access_token?'':'disabled'}>Load referrals</button></div><div id="onlineReferralList" style="margin-top:10px"><div class="small muted">${os?.access_token?'Tap Load referrals to retrieve authorized online referrals.':'Sign in after configuring Supabase to use live referrals.'}</div></div>
   <div class="grid2" style="margin-top:10px"><div><label class="f" for="ocMessageReferral">Referral UUID for message</label><input id="ocMessageReferral" placeholder="Select/copy an online referral UUID"></div><div><label class="f" for="ocMessage">Message</label><input id="ocMessage" maxlength="3000" placeholder="Write a de-identified message"></div></div><div class="row"><button class="btn" data-act="onlineSendMessage" ${os?.access_token?'':'disabled'}>Send online message</button><button class="btn" data-act="onlineLoadMessages" ${os?.access_token?'':'disabled'}>Load thread</button></div><div id="onlineMessageList" style="margin-top:8px"></div></div>
  <div class="card"><div class="row between"><div><h3>Cross-hospital specialist desk (offline)</h3><div class="small muted">Case-linked discussion and portable message threads for cytotechnologists, pathologists and reference centres.</div></div><span class="chip">Local-first</span></div>

   <div class="grid2"><div><label class="f" for="collabHospital">Receiving hospital / centre</label><input id="collabHospital" placeholder="e.g. Regional reference laboratory"></div><div><label class="f" for="collabSpecialist">Specialist / role</label><input id="collabSpecialist" placeholder="e.g. Pathologist on call"></div></div>
