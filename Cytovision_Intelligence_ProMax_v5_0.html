CHG.collabCase=el=>{S.activeId=el.value||null;saveSettings();paintNet()};
function onlineCfgFromForm(){const old=OnlineCollab.cfg();return {url:($('#ocUrl')?.value||old.url).trim(),anonKey:($('#ocAnon')?.value||old.anonKey).trim(),organizationId:($('#ocOrg')?.value||old.organizationId).trim(),targetOrganizationId:($('#ocTargetOrg')?.value||old.targetOrganizationId).trim()}}
ACT.onlineLogin=async()=>{try{const c=onlineCfgFromForm();OnlineCollab.saveCfg(c);const email=$('#ocEmail')?.value.trim()||'',password=$('#ocPassword')?.value||'';if(!email||!password)throw new Error('Enter your authorized email and password');await OnlineCollab.login(email,password);paintNet();toast('Signed in to the configured specialist network','good');await ACT.onlineRefresh()}catch(e){toast('Online sign-in failed: '+e.message,'bad')}};
ACT.onlineLogout=async()=>{try{if(OnlineCollab.session()?.access_token)await OnlineCollab.request('/auth/v1/logout',{method:'POST',body:{},auth:true})}catch(e){}OnlineCollab.setSession(null);paintNet();toast('Signed out. This browser session token was cleared.','good')};
ACT.onlineRefresh=async()=>{const host=$('#onlineReferralList');if(host)host.innerHTML='<div class="small muted">Loading referrals…</div>';try{const c=onlineCfgFromForm();OnlineCollab.saveCfg(c);const rows=await OnlineCollab.listReferrals();if(host)host.innerHTML=rows.length?rows.map(r=>`<div class="flat" style="margin:7px 0"><div class="row between"><b>${esc(r.case_id||'Case')}</b><span class="chip ${r.status==='completed'?'routine':'high'}">${esc(r.status||'requested')}</span></div><div class="small">${esc(r.from_lab||'Sending lab')} → ${esc(r.to_lab||'Receiving lab')}</div><div class="small" style="white-space:pre-wrap">${esc(r.question||'')}</div><div class="tiny muted">Referral UUID: <code>${esc(r.id)}</code> · ${fmtDT(r.created_at)}</div><button class="btn sm" data-act="onlineSelectReferral" data-id="${esc(r.id)}">Open message thread</button></div>`).join(''):'<div class="small muted">No referrals visible to this organization yet.</div>';toast('Loaded '+rows.length+' authorized referral(s)','good')}catch(e){if(host)host.innerHTML=`<div class="note bad small">Could not load referrals: ${esc(e.message)}</div>`;toast('Online refresh failed: '+e.message,'bad')}};

ACT.collabSend=()=>{const caseId=$('#collabCase')?.value||'',text=$('#collabMessage')?.value.trim()||'',hospital=$('#collabHospital')?.value.trim()||'',specialist=$('#collabSpecialist')?.value.trim()||'';if(!caseId)return toast('Register/select a case first','bad');if(!text)return toast('Write a message first','bad');if(phiCheck(text,hospital,specialist).length)return toast('Remove possible patient identifiers before saving','bad');const d=collabLoad(),t=d.threads[caseId]||(d.threads[caseId]=[]);t.push({id:uid(),caseId,ts:now(),author:auditUser(),authorRole:S.user.role,hospital,specialist,text});collabSave(d);const c=S.cases.find(x=>x.id===caseId);if(c){c.comments=c.comments||[];c.comments.push({ts:now(),user:auditUser()+' · collaboration desk',text});logEvent(c,'Specialist desk message saved',hospital+' · '+text.slice(0,80));saveCase(c)}sysLog('Collaboration message saved',caseId);paintNet();toast('Message saved on this device. Export the thread to exchange it.','good')};
ACT.collabExport=async el=>{const caseId=el.dataset.case;if(!caseId)return;const d=collabLoad(),o={format:'cytovision-collaboration-thread',version:1,caseId,exportedAt:now(),fromLab:S.settings.labName||'',messages:d.threads[caseId]||[]};o.hash=sha256(JSON.stringify(o));await saveBlob('cytovision_thread_'+caseId+'.json',new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),{share:true})};
CHG.collabImport=async el=>{const f=el.files&&el.files[0];el.value='';if(!f)return;try{const o=JSON.parse(await f.text()),h=o.hash;delete o.hash;if(o.format!=='cytovision-collaboration-thread'||sha256(JSON.stringify(o))!==h)throw new Error('Unsupported thread or integrity check failed');if(!o.caseId||!Array.isArray(o.messages))throw new Error('Thread is incomplete');const d=collabLoad(),t=d.threads[o.caseId]||(d.threads[o.caseId]=[]),seen=new Set(t.map(m=>m.id));for(const m of o.messages)if(!seen.has(m.id))t.push(m);collabSave(d);S.activeId=S.cases.some(c=>c.id===o.caseId)?o.caseId:S.activeId;saveSettings();paintNet();toast('Imported '+o.messages.length+' message record(s). Review the source before relying on them.','good')}catch(e){toast('Thread import failed: '+e.message,'bad')}};

function netSync(){
  const c=Sync.cfg(),o=Sync.out(),ids=Object.keys(o),cf=S.cases.filter(x=>x.syncConflict);
  return `<div class="note ${c.mode==='http'?(Sync.failed()?'bad':'good'):''}"><b>${esc(Sync.label())}</b>${c.lastErr?`<br><span class="small">Last error: ${esc(c.lastErr)}</span>`:''}</div>
  <div class="card"><h3>How sync works</h3><div class="small muted">Everything works offline. Changes queue on this device and sync automatically when a connection returns. Payloads are encrypted on the device (AES-256-GCM, key from your lab passphrase) before they leave it, so the server only stores ciphertext. Verified reports are never silently overwritten.</div>
   <label class="f" for="syM">Mode</label><select id="syM" data-chg="syCfg" data-k="mode"><option value="off" ${c.mode==='off'?'selected':''}>Off (offline only)</option><option value="http" ${c.mode==='http'?'selected':''}>Sync server (HTTPS)</option></select>
   <label class="f" for="syU">Server URL</label><input id="syU" type="text" value="${esc(c.url)}" data-chg="syCfg" data-k="url" placeholder="https://sync.example.org">
   <label class="f" for="syT">Access token</label><input id="syT" type="password" value="${esc(c.token)}" data-chg="syCfg" data-k="token" autocomplete="off">
   <label class="f" for="syL">Lab code (same on every device in the network)</label><input id="syL" type="text" value="${esc(c.lab)}" data-chg="syCfg" data-k="lab" placeholder="e.g. DISTRICT-A">
   <div class="row" style="margin-top:10px"><button class="btn primary" data-act="syUnlock">${Sync.key?'Change passphrase':'Enter lab passphrase'}</button><button class="btn" data-act="syNow" ${c.mode==='http'?'':'disabled'}>Sync now</button></div>
   <div class="tiny muted" style="margin-top:6px">Device ${esc(Sync.device())}. The passphrase is kept in memory only, so sync pauses after a restart until you re-enter it. Endpoints must be HTTPS (localhost allowed for testing).</div></div>
  <div class="card"><h3>Queue</h3>${ids.length?ids.map(id=>`<div class="flat" style="margin:6px 0"><b>${esc(id)}</b> <span class="small muted">rev ${o[id].rev} · tries ${o[id].tries||0}${o[id].tries>=3?' · <span style="color:var(--eosin)">failing</span>':''}${o[id].err?' · '+esc(o[id].err):''}</span></div>`).join(''):'<div class="small muted">Nothing waiting.</div>'}</div>
  ${cf.length?`<div class="card"><h3>Conflicts needing a person</h3>${cf.map(x=>`<div class="note bad small"><b>${esc(x.id)}</b>: two different verified reports exist (server signed by ${esc(x.syncConflict.server.signedBy||'?')}). Resolve clinically, then dismiss.<div><button class="btn sm" data-act="syDismiss" data-id="${esc(x.id)}">Keep mine and dismiss</button></div></div>`).join('')}</div>`:''}
  <div class="card"><h3>System log</h3><div class="tbl-wrap"><table class="tbl"><tbody>${(()=>{try{return JSON.parse(localStorage.getItem('rc3_syslog')||'[]').slice(-12).reverse()}catch(e){return []}})().map(e=>`<tr><td class="tiny">${fmtDT(e.ts)}</td><td><b>${esc(e.action)}</b><div class="tiny muted">${esc(e.detail)}</div></td></tr>`).join('')||'<tr><td class="muted small">Empty</td></tr>'}</tbody></table></div></div>`;
}

function netInterop(){

  const d=S.settings.retentionDays||0;if(!d)return toast('Set a retention period first');const lim=Date.now()-d*864e5;

  if(!l.length)return toast('No verified case images are older than '+d+' days','good');

};

async function buildBackup(){
  await flushAll();const items=[];
  for(const c of S.cases){const rec=await DB.getImage(c.id);items.push({case:c,image:rec&&rec.blob?{mime:'image/jpeg',w:rec.w,h:rec.h,b64:b64(new Uint8Array(await rec.blob.arrayBuffer()))}:null})}
  return {format:'rapidcyt-vault',v:3,exported:now(),by:auditUser(),count:items.length,items};
}

  if(!await confirmBox('A plain backup is readable by anyone who gets the file. Prefer the encrypted backup for anything sensitive.',{ok:'Export plain'}))return;
  toast('Preparing backup…');const b=await buildBackup();await saveBlob(`rapidcyt_backup_${new Date().toISOString().slice(0,10)}.json`,new Blob([JSON.stringify(b)],{type:'application/json'}),{share:true});

ACT.backupEnc=async()=>{
  if(!HAS_SUBTLE)return toast('Encryption needs a secure context (HTTPS or the app). Not available here.','bad');
  const pw=await askText('Encrypt backup','Password (12+ characters recommended)',{type:'password',ok:'Encrypt'});if(!pw)return;if(pw.length<8)return toast('Use at least 8 characters','bad');
  const pw2=await askText('Confirm password','Type it again',{type:'password',ok:'Encrypt'});if(pw2!==pw)return toast('Passwords differ','bad');

function hstImageMetrics(img){const scale=Math.min(160/Math.max(1,img.width),160/Math.max(1,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0,cv.width,cv.height);const d=cx.getImageData(0,0,cv.width,cv.height).data;let n=0,sum=0,sum2=0,sat=0,pink=0,purple=0,tissue=0,lap=0,lap2=0;const lum=[];for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],L=.2126*r+.7152*g+.0722*b;lum.push(L);sum+=L;sum2+=L*L;sat+=Math.max(r,g,b)-Math.min(r,g,b);const isT=L<238&&(Math.max(r,g,b)-Math.min(r,g,b)>10);if(isT)tissue++;if(r>g*1.08&&b>g*1.02&&r>100)pink++;if(b>r*.92&&b>g*1.08&&r<190)purple++;n++}for(let y=1;y<cv.height-1;y++)for(let x=1;x<cv.width-1;x++){const i=y*cv.width+x,v=4*lum[i]-lum[i-1]-lum[i+1]-lum[i-cv.width]-lum[i+cv.width];lap+=v;lap2+=v*v}const sharp=lap2/Math.max(1,(cv.width-2)*(cv.height-2))-(lap/Math.max(1,(cv.width-2)*(cv.height-2)))**2;return {width:img.width,height:img.height,meanBrightness:+(sum/n).toFixed(1),contrast:+Math.sqrt(Math.max(0,sum2/n-(sum/n)**2)).toFixed(1),meanSaturation:+(sat/n).toFixed(1),approxTissuePercent:+(100*tissue/n).toFixed(1),pinkLikePercent:+(100*pink/n).toFixed(1),purpleLikePercent:+(100*purple/n).toFixed(1),focusProxy:+sharp.toFixed(1),warning:'Heuristic image-quality/stain proxies only; not a diagnosis, validated tissue segmentation, or calibrated scanner QC.'}}

 ACT.saveMonitoring=()=>{const c=active();if(!c)return toast('Select a case first','bad');c.monitoring={reviewedAt:now(),reviewer:$('#monReviewer')?.value.trim()||auditUser(),disagreement:$('#monDisagreement')?.value||'none',note:$('#monNote')?.value.trim()||''};logEvent(c,'Monitoring review recorded',JSON.stringify(c.monitoring));saveCase(c);VIEWS.insights()};
 ACT.saveIntendedUse=()=>{const v=$('#intendedUseEdit')?.value.trim();if(!v)return toast('Intended-use statement is required','bad');S.settings.intendedUse=v;saveSettings();toast('Intended-use statement saved locally','good');VIEWS.insights()};
 const oldTuneApply=ACT.tuneApply;ACT.tuneApply=async el=>{if(AI.meta.lock&&currentLockOK()){if(!await confirmBox('Changing the threshold invalidates the model lock and test evaluation. Unlock first?',{ok:'Unlock and continue',title:'Invalidate test evaluation'}))return;invalidateTest('threshold change');S.cases.forEach(c=>logEvent(c,'Model configuration changed; test results stale','threshold'));}return oldTuneApply(el)};
 const oldPlattFit=ACT.plattFit;ACT.plattFit=async()=>{if(AI.meta.lock&&currentLockOK()){if(!await confirmBox('Fitting Platt calibration changes the frozen configuration and invalidates test results. Continue?',{ok:'Unlock and fit',title:'Invalidate test evaluation'}))return;invalidateTest('Platt calibration fit');S.cases.forEach(c=>logEvent(c,'Model configuration changed; test results stale','Platt calibration fit'));}return oldPlattFit()};
 const oldPlattUse=ACT.plattUse;ACT.plattUse=async()=>{if(AI.meta.lock&&currentLockOK()){if(!await confirmBox('Changing calibration use invalidates the model lock and test results. Continue?',{ok:'Unlock and continue',title:'Invalidate test evaluation'}))return;invalidateTest('Platt use toggled')}return oldPlattUse()};
 const oldPlattClear=ACT.plattClear;ACT.plattClear=async()=>{if(AI.meta.lock&&currentLockOK()){if(!await confirmBox('Clearing calibration invalidates the model lock and test results. Continue?',{ok:'Unlock and clear',title:'Invalidate test evaluation'}))return;invalidateTest('Platt calibration cleared')}return oldPlattClear()};
})();
</script>
